spring:
  config:
    activate:
      on-profile: local,test

ditto:
  oauth:
    kakao:
      client-id: test-client-id
      client-secret: ""
      redirect-uri: http://localhost:8080/api/v1/users/social-login/KAKAO/callback
      admin-redirect-uri: http://localhost:8080/admin/oauth/kakao/callback
      # 앱에 안 켜진 동의항목을 넘기면 카카오가 로그인을 거부한다. 로컬은 페이크 클라이언트라 값이 의미 없다.
      scopes: profile_nickname
      connect-timeout: 3s
      read-timeout: 5s
    apple:
      # ID 토큰의 aud 로 허용할 값 — 앱은 번들 ID, 웹은 Services ID 다.
      client-ids: pics.ditto.app,pics.ditto.web
      # 웹 로그인용 Services ID 와 애플이 폼 POST 로 돌려보낼 우리 콜백 주소.
      web-client-id: pics.ditto.web
      web-redirect-uri: http://localhost:8080/api/v1/users/social-login/APPLE/callback
      # 어드민 로그인의 Return URL. 애플은 https 만 Return URL 로 받으므로 로컬에서는 실제로 동작하지 않는다
      # (로컬 어드민 로그인은 /admin/oauth/dev 를 쓴다). 형식 확인용으로만 채워 둔다.
      admin-web-redirect-uri: http://localhost:8080/admin/oauth/apple/callback
      jwks-cache-ttl: 6h
      connect-timeout: 3s
      read-timeout: 5s

---
spring:
  config:
    activate:
      on-profile: develop

---
spring:
  config:
    activate:
      on-profile: prod

ditto:
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
      admin-redirect-uri: ${KAKAO_ADMIN_REDIRECT_URI}
      # 콘솔에서 동의항목을 켜면 여기가 아니라 .aws/task-definition.json 의 KAKAO_SCOPES 를 늘린다.
      scopes: ${KAKAO_SCOPES:profile_nickname}
      connect-timeout: 3s
      read-timeout: 5s
    apple:
      # 앱 번들 ID + 웹 Services ID 를 콤마로 나열한다.
      # 값이 비면 모든 애플 토큰의 aud 검증이 실패하므로 배포 전 반드시 주입한다.
      client-ids: ${APPLE_CLIENT_IDS:pics.ditto.app}
      # 웹 로그인을 쓰려면 둘 다 필요하다. 콘솔의 Services ID / Return URL 과 정확히 같아야 한다.
      web-client-id: ${APPLE_WEB_CLIENT_ID:}
      web-redirect-uri: ${APPLE_WEB_REDIRECT_URI:}
      # 어드민 Return URL 도 콘솔의 같은 Services ID 에 함께 등록해야 한다.
      admin-web-redirect-uri: ${APPLE_ADMIN_REDIRECT_URI:}
      jwks-cache-ttl: 6h
      connect-timeout: 3s
      read-timeout: 5s
