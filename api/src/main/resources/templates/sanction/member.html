<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('제재 관리')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments :: sidebar('member')}"></aside>
    <div class="main-wrap">
        <header th:replace="~{fragments :: topbar}"></header>
        <main class="content">
            <h1 class="page-title">
                제재 관리: <span th:text="${view.nickname}">닉네임</span>
                <span th:replace="~{member/parts :: memberStatusBadge(${view.memberStatus})}"></span>
            </h1>
            <p class="page-desc">누적 제재 <strong th:text="${view.strikeCount}">0</strong>건. 허위 신고자 제재와 해제한 제재는 세지 않습니다.</p>
            <div th:replace="~{fragments :: alerts}"></div>

            <!-- 어드민 직접 제재 -->
            <div class="card">
                <h2>어드민 직접 제재</h2>
                <form th:action="@{/admin/members/{id}/sanctions(id=${view.memberId})}" method="post" class="field-row" style="align-items:flex-end">
                    <div class="field">
                        <label>제재 종류</label>
                        <select name="level">
                            <option th:each="l : ${levels}" th:value="${l.name()}" th:text="${l.description}">제재 종류</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>제재 근거</label>
                        <select name="origin">
                            <option th:each="o : ${origins}" th:value="${o.name()}" th:text="${o.description}">제재 근거</option>
                        </select>
                    </div>
                    <div class="field" style="flex:1">
                        <label>메모 (선택)</label>
                        <input type="text" name="note" maxlength="500"/>
                    </div>
                    <div class="field"><button class="btn" type="submit">제재 적용</button></div>
                </form>
                <p class="muted">허위 신고자를 제재할 때는 제재 근거를 '허위 신고자 제재'로 고르세요. 이 제재는 누적 제재 수에 들어가지 않습니다.</p>
            </div>

            <!-- 이력 -->
            <div class="card">
                <h2>제재 이력 <span class="badge cat" th:text="${view.sanctions.size()} + '건'">0건</span></h2>
                <p class="muted" th:if="${view.sanctions.isEmpty()}">제재 이력이 없습니다.</p>
                <table class="tbl" th:unless="${view.sanctions.isEmpty()}">
                    <thead>
                    <tr><th>#</th><th>제재 종류</th><th>제재 근거</th><th>상태</th><th>기간</th><th>처리자</th><th>메모</th><th></th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${view.sanctions}">
                        <td th:text="${s.id}">1</td>
                        <td th:text="${s.levelDescription}">제재 종류</td>
                        <td th:text="${s.originDescription}">제재 근거</td>
                        <td th:text="${s.statusDescription}">상태</td>
                        <td>
                            <span th:text="${#temporals.format(s.startsAt, 'yy-MM-dd HH:mm')}">시작</span> ~
                            <span th:text="${s.endsAt != null} ? ${#temporals.format(s.endsAt, 'yy-MM-dd HH:mm')} : '영구'">끝</span>
                        </td>
                        <td th:text="${s.creatorName}">처리자</td>
                        <td th:text="${s.note ?: '-'}">메모</td>
                        <td>
                            <form th:if="${s.liftable}" th:action="@{/admin/sanctions/{id}/lift(id=${s.id})}" method="post" class="inline-form">
                                <input type="hidden" name="memberId" th:value="${view.memberId}"/>
                                <button class="btn secondary sm" type="submit">해제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
