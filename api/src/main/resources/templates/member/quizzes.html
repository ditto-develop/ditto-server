<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('회원별 퀴즈 현황')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments :: sidebar('member')}"></aside>
    <div class="main-wrap">
        <header th:replace="~{fragments :: topbar}"></header>
        <main class="content participants-page" th:with="member=${view.member}">
            <a class="muted" th:href="@{/admin/members(q=|#${member.memberId}|)}">← 회원 관리</a>
            <h1 class="page-title member-cell" style="margin-top:8px">
                <span class="member-name" th:text="${member.nickname}">닉네임</span>
                <span class="member-id" th:text="|#${member.memberId}|">#1</span>
                <span class="badge cat" th:unless="${member.isDummy}">실회원</span>
                <th:block th:switch="${member.status.name()}">
                    <span class="badge matching" th:case="'PENDING'">가입 미완료</span>
                    <span class="badge matching" th:case="'SUSPENDED'">정지</span>
                    <span class="badge matching" th:case="'BANNED'">차단</span>
                    <span class="badge matching" th:case="'LEFT'">탈퇴</span>
                </th:block>
            </h1>
            <p class="page-desc">퀴즈셋 전체를 최신 주부터 보여 줍니다. 참여하지 않은 셋은 "참여 안 함"으로 표시합니다.</p>
            <div th:replace="~{fragments :: alerts}"></div>

            <div class="card">
                <h2>참여한 퀴즈셋 <span class="count" th:text="|${view.participatedCount} / ${view.rows.size()}|">0 / 0</span></h2>
                <p class="muted" th:if="${view.rows.isEmpty()}" style="margin:0">퀴즈셋이 없습니다.</p>
                <th:block th:unless="${view.rows.isEmpty()}">
                    <p class="muted" style="margin:0 0 12px">
                        1:1 후보가 없을 때 풀 단계 이유(상위 비율 컷, 자격 있는 짝 없음 등)는 계산하지 않고 "후보 없음"으로 둡니다. 참여 현황에서 이 회원을 걸러 보면 이유가 나옵니다.
                    </p>
                    <div class="participant-table">
                        <table class="tbl">
                            <thead>
                            <tr><th>퀴즈셋</th><th>진행</th><th>매칭</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="row : ${view.rows}" th:with="quizSet=${row.quizSet}">
                                <td>
                                    <div class="nowrap">
                                        <a class="member-search-link" th:href="@{/admin/quiz-sets/{id}(id=${quizSet.id})}" th:text="${quizSet.title}">제목</a>
                                        <span class="badge off" th:unless="${quizSet.isActive}">비활성</span>
                                    </div>
                                    <div class="muted nowrap">
                                        <span th:text="${@weekLabel.of(quizSet.weekStartedOn)}">-</span> ·
                                        <span th:text="${quizSet.matchingType}">TYPE</span>
                                    </div>
                                    <div class="member-actions" th:if="${row.progress != null}">
                                        <a class="text-link" th:href="@{/admin/quiz-sets/{id}/participants(id=${quizSet.id},q=|#${member.memberId}|)}">참여 현황에서 보기</a>
                                    </div>
                                </td>
                                <td class="nowrap">
                                    <span class="muted" th:if="${row.progress == null}">참여 안 함</span>
                                    <th:block th:unless="${row.progress == null}" th:with="progress=${row.progress}">
                                        <th:block th:switch="${progress.status.name()}">
                                            <span class="badge on" th:case="'COMPLETED'">완료</span>
                                            <span class="badge matching" th:case="'IN_PROGRESS'">진행 중</span>
                                            <span class="badge off" th:case="*">시작 전</span>
                                        </th:block>
                                        <span class="num" th:text="|${progress.answeredCount}/${progress.totalCount}|">3/3</span>
                                    </th:block>
                                </td>
                                <td class="match-cell">
                                    <th:block th:if="${row.matching != null}">
                                        <th:block th:replace="~{quiz/parts :: matchCell(${row.matching}, ${quizSet.id})}"></th:block>
                                    </th:block>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </th:block>
            </div>
        </main>
    </div>
</div>
</body>
</html>
