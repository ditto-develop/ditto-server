<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 회원 표(재사용). 한 화면에 두 번 그려질 수 있어 (i) id 를 받는다. 호출 컨텍스트의 ${roles}, ${q}, ${admin} 을 사용한다. -->
<div th:fragment="memberTable(rows, roleInfoId)" class="tbl-scroll">
    <table class="tbl">
        <thead>
        <tr><th>ID</th><th>닉네임</th><th>이메일</th><th>상태</th><th>현재 권한</th>
            <th><span class="with-info">권한 바꾸기
                <th:block th:replace="~{fragments :: info(${roleInfoId}, '권한 바꾸기', '관리자 권한이 있는 계정만 어드민에 로그인할 수 있습니다. 본인 권한은 여기서 바꿀 수 없습니다.')}"></th:block></span></th>
            <th></th></tr>
        </thead>
        <tbody>
        <tr th:each="m : ${rows}">
            <td class="num" th:text="${m.id}">-</td>
            <td th:text="${m.nickname}">nick</td>
            <td th:text="${m.email}">email</td>
            <td><span th:replace="~{member/parts :: memberStatusBadge(${m.status})}"></span></td>
            <td>
                <span class="badge" th:classappend="${m.admin} ? 'info' : 'neutral'" th:text="${m.role.description}">일반 회원</span>
            </td>
            <td>
                <span class="muted" th:if="${admin != null and m.id == admin.memberId}">본인</span>
                <form class="btn-row" style="margin:0" th:unless="${admin != null and m.id == admin.memberId}"
                      th:action="@{/admin/members/{id}/role(id=${m.id})}" method="post"
                      th:attr="data-member=|${m.nickname} (#${m.id})|"
                      onsubmit="return confirm(this.dataset.member + '의 권한을 ' + this.role.selectedOptions[0].text + '(으)로 바꿉니다. 계속할까요?');">
                    <input type="hidden" name="q" th:value="${q}"/>
                    <select name="role" style="width:auto; padding:7px 10px; border:1px solid var(--border); border-radius:8px; font-family:inherit;">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.description}" th:selected="${r == m.role}"></option>
                    </select>
                    <button class="btn sm" type="submit">바꾸기</button>
                </form>
            </td>
            <td class="actions">
                <a class="btn secondary sm" th:href="@{/admin/members/{id}/quizzes(id=${m.id},q=${q})}">퀴즈 현황</a>
                <a class="btn secondary sm" th:href="@{/admin/members/{id}/sanctions(id=${m.id})}">제재 관리</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- 회원 상태 배지(재사용). 회원 행이 지워져 status 가 null 이면 탈퇴로 보여 준다. -->
<th:block th:fragment="memberStatusBadge(status)">
    <th:block th:switch="${status?.name()}">
        <span class="badge neutral" th:case="'ACTIVE'">정상</span>
        <span class="badge neutral" th:case="'PENDING'">가입 미완료</span>
        <span class="badge danger" th:case="'SUSPENDED'">이용 정지</span>
        <span class="badge danger" th:case="'BANNED'">영구 차단</span>
        <span class="badge neutral" th:case="*">탈퇴</span>
    </th:block>
</th:block>
</body>
</html>
