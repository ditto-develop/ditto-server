<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('회원 관리')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments :: sidebar('member')}"></aside>
    <div class="main-wrap">
        <header th:replace="~{fragments :: topbar}"></header>
        <main class="content">
            <h1 class="page-title">회원 관리</h1>
            <p class="page-desc">닉네임·회원 ID나 이메일로 회원을 찾고, 권한(Role)을 변경합니다.</p>
            <div th:replace="~{fragments :: alerts}"></div>

            <!-- 현재 관리자 -->
            <div class="card">
                <h2>현재 관리자 <span class="badge cat" th:text="${admins.size()} + '명'">0명</span></h2>
                <p class="muted" th:if="${admins.isEmpty()}">관리자가 없습니다.</p>
                <div th:unless="${admins.isEmpty()}" th:replace="~{member/parts :: memberTable(${admins})}"></div>
            </div>

            <div class="card">
                <form th:action="@{/admin/members}" method="get" class="field-row" style="align-items:flex-end">
                    <div class="field" style="flex:1">
                        <label for="memberQuery">닉네임·회원 ID로 찾기</label>
                        <input type="search" id="memberQuery" name="q" th:value="${q}" placeholder="예: dummy-female, #123" autocomplete="off"/>
                    </div>
                    <div class="field"><button class="btn" type="submit">찾기</button></div>
                </form>
                <th:block th:if="${searchResults != null}">
                    <p class="muted" style="margin:0" th:if="${searchResults.isEmpty()}">
                        맞는 회원이 없습니다. 회원 ID는 #을 붙여 찾습니다(예: #123).
                    </p>
                    <th:block th:unless="${searchResults.isEmpty()}">
                        <p class="muted" style="margin:0 0 12px" th:if="${searchResults.size() >= searchLimit}"
                           th:text="|ID 순으로 앞 ${searchLimit}명까지만 보여 줍니다. 더 좁혀 찾으세요.|">앞 50명까지만</p>
                        <table class="tbl">
                            <thead>
                            <tr><th>회원</th><th>상태</th><th></th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="m : ${searchResults}">
                                <td class="member-cell">
                                    <span class="member-name" th:text="${m.nickname}">닉네임</span>
                                    <span class="member-id" th:text="|#${m.memberId}|">#1</span>
                                    <span class="badge cat" th:unless="${m.isDummy}">실회원</span>
                                </td>
                                <td class="num" th:text="${m.status}">ACTIVE</td>
                                <td><a class="btn secondary sm" th:href="@{/admin/members/{id}/quizzes(id=${m.memberId})}">퀴즈 현황</a></td>
                            </tr>
                            </tbody>
                        </table>
                    </th:block>
                </th:block>
            </div>

            <!-- 이메일 검색 -->
            <div class="card">
                <form th:action="@{/admin/members}" method="get" class="field-row" style="align-items:flex-end">
                    <div class="field" style="flex:1">
                        <label>이메일로 검색</label>
                        <input type="text" name="email" th:value="${email}" placeholder="member@example.com"/>
                    </div>
                    <div class="field"><button class="btn" type="submit">검색</button></div>
                </form>
            </div>

            <!-- 검색 결과 -->
            <div class="card" th:if="${searched}">
                <h2>검색 결과</h2>
                <p class="muted" th:if="${members == null or members.isEmpty()}">검색 결과가 없습니다.</p>
                <div th:unless="${members == null or members.isEmpty()}" th:replace="~{member/parts :: memberTable(${members})}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
