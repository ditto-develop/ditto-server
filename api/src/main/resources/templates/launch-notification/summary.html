<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('출시 알림 신청')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments :: sidebar('launch-notification')}"></aside>
    <div class="main-wrap">
        <header th:replace="~{fragments :: topbar}"></header>
        <main class="content">
            <h1 class="page-title">출시 알림 신청</h1>
            <p class="page-desc">웹 방문자가 남긴 앱 출시 알림 신청입니다. 이메일은 화면에 보여 주지 않고 CSV로만 내보냅니다.</p>
            <div th:replace="~{fragments :: alerts}"></div>

            <div class="card" th:if="${platforms.size() > 1}">
                <div class="btn-row">
                    <span class="muted">플랫폼</span>
                    <a th:each="p : ${platforms}"
                       th:href="@{/admin/launch-notifications(platform=${p.name()})}"
                       th:text="${p.description}"
                       th:classappend="${p == summary.platform} ? 'btn sm' : 'btn secondary sm'">플랫폼</a>
                </div>
            </div>

            <div class="card">
                <h2 th:text="${summary.platform.description} + ' 신청'">안드로이드 신청</h2>
                <table class="tbl">
                    <tbody>
                    <tr>
                        <th>안내 대기</th>
                        <td th:text="${summary.pendingCount} + '건'">0건</td>
                    </tr>
                    <tr>
                        <th>안내 완료 (파기 대기)</th>
                        <td th:text="${summary.notifiedCount} + '건'">0건</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="card">
                <h2>출시 안내 보내기</h2>
                <p class="muted" th:if="${summary.latestPendingId == null}">안내를 기다리는 신청이 없습니다.</p>
                <th:block th:unless="${summary.latestPendingId == null}">
                    <ol class="muted">
                        <li>CSV를 내려받아 메일을 보냅니다. 이 화면을 연 시점까지의 신청만 담깁니다.</li>
                        <li>보낸 뒤 "발송 완료"를 누릅니다. 같은 범위만 완료로 바뀌고, 그 사이 들어온 신청은 다음 차례로 남습니다.</li>
                        <li th:text="'완료한 신청은 ' + ${retentionDays} + '일 뒤 자동으로 파기됩니다.'">완료한 신청은 30일 뒤 자동으로 파기됩니다.</li>
                    </ol>
                    <div class="btn-row">
                        <a class="btn secondary"
                           th:href="@{/admin/launch-notifications/export(platform=${summary.platform.name()},upToId=${summary.latestPendingId})}">CSV 내려받기</a>
                        <form th:action="@{/admin/launch-notifications/mark-notified}" method="post"
                              onsubmit="return confirm('메일을 보낸 뒤에 누르세요. 완료한 신청은 되돌릴 수 없고 기간이 지나면 파기됩니다. 계속할까요?')">
                            <input type="hidden" name="platform" th:value="${summary.platform.name()}"/>
                            <input type="hidden" name="upToId" th:value="${summary.latestPendingId}"/>
                            <button class="btn" type="submit">발송 완료</button>
                        </form>
                    </div>
                </th:block>
            </div>
        </main>
    </div>
</div>
</body>
</html>
