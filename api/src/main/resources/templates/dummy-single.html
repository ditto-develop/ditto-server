<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('더미 한 명 만들기')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments :: sidebar('dummy')}"></aside>
    <div class="main-wrap">
        <header th:replace="~{fragments :: topbar}"></header>
        <main class="content">
            <a class="muted" th:href="@{/admin/dummy}">← 더미 생성</a>
            <a class="dummy-link" th:href="@{/admin/quiz-sets/{id}/participants(id=${questions.quizSetId})}">이 퀴즈셋 참여 현황 보기 →</a>
            <h1 class="page-title" style="margin-top:8px">더미 한 명 만들기</h1>
            <p class="page-desc">
                <span th:text="|${@weekLabel.of(questions.quizSet.weekStartedOn)} · ${questions.quizSet.title} (${questions.quizSet.matchingType})|">퀴즈셋</span>
                에 프로필과 답을 지정해 더미를 만듭니다. 비워 둔 값은 무작위로 채웁니다.
                매칭 후보는 만들지 않으니, 만든 뒤 '매칭 실행'에서 재생성하세요.
            </p>
            <div th:replace="~{fragments :: alerts}"></div>

            <form th:object="${form}" th:action="@{/admin/dummy/single}" method="post"
                  onsubmit="return confirm('운영 환경을 포함한 모든 환경에서 실행됩니다.\n이 값으로 더미를 만들까요?');">
                <input type="hidden" th:field="*{quizSetId}"/>

                <div class="card">
                    <h2>프로필</h2>
                    <div class="field">
                        <label>닉네임</label>
                        <div class="dummy-nickname">
                            <span class="muted">dummy-</span>
                            <input type="text" th:field="*{nicknameSuffix}" maxlength="20" placeholder="비우면 자동 생성"/>
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label>성별</label>
                            <div class="dummy-options">
                                <label class="check" th:each="g : ${genders}">
                                    <input type="radio" th:field="*{gender}" th:value="${g}"/>
                                    <span th:text="${g.name() == 'MALE'} ? '남' : '여'">남</span>
                                </label>
                            </div>
                        </div>
                        <div class="field"><label>나이</label><input type="number" th:field="*{age}" min="20" max="100"/></div>
                        <div class="field">
                            <label>캐리커쳐</label>
                            <select th:field="*{avatarNumber}">
                                <option value="">무작위</option>
                                <option th:each="n : ${avatarNumbers}" th:value="${n}" th:text="|${n}번|">1번</option>
                            </select>
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label>사는 곳</label>
                            <select th:field="*{location}">
                                <option th:each="l : ${locations}" th:value="${l}" th:text="${l.description}">서울</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>직업</label>
                            <select th:field="*{job}">
                                <option th:each="j : ${jobs}" th:value="${j}" th:text="${j.description}">IT/기술</option>
                            </select>
                        </div>
                    </div>
                    <div class="field">
                        <label>관심사 (1~5개)</label>
                        <div class="dummy-options">
                            <label class="check" th:each="i : ${interests}">
                                <input type="checkbox" th:field="*{interests}" th:value="${i}"/>
                                <span th:text="${i.description}">운동</span>
                            </label>
                        </div>
                    </div>
                    <p class="muted" style="margin:0">캐리커쳐는 성별에 맞는 아바타 중 그 번호를 씁니다. 매칭 성별 선호는 실회원처럼 이성(OPPOSITE)입니다.</p>
                </div>

                <div class="card">
                    <h2>퀴즈 답 <span class="muted" th:text="|(${#lists.size(questions.quizzes)}문항)|">(0문항)</span></h2>
                    <div class="field">
                        <label>푼 문항 수</label>
                        <input type="number" th:field="*{answeredCount}" min="0"
                               th:max="${#lists.size(questions.quizzes)}" placeholder="비우면 전부 풀이(완료)"/>
                        <p class="muted" style="margin:6px 0 0">값을 주면 위에서부터 그 수만큼만 답하고 진행 중으로 둡니다. 0이면 퀴즈를 시작하지 않은 회원이 됩니다.</p>
                    </div>
                    <div class="ro-quiz" th:each="quiz, stat : ${questions.quizzes}">
                        <span class="no" th:text="${stat.count}">1</span>
                        <div>
                            <div th:text="${quiz.question}">질문</div>
                            <div class="dummy-options">
                                <label class="check">
                                    <input type="radio" th:name="|choiceIdByQuizId[${quiz.id}]|" value=""
                                           th:checked="${form.choiceIdByQuizId[quiz.id] == null}"/>
                                    <span class="muted">무작위</span>
                                </label>
                                <label class="check" th:each="choice : ${questions.choicesOf(quiz)}">
                                    <input type="radio" th:name="|choiceIdByQuizId[${quiz.id}]|" th:value="${choice.id}"
                                           th:checked="${form.choiceIdByQuizId[quiz.id] == choice.id}"/>
                                    <span th:text="${choice.content}">선택지</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn">더미 만들기</button>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
