<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 참여자 한 명의 매칭 칸. 상대 회원 링크는 그 퀴즈셋 참여 현황 검색으로 간다. -->
<th:block th:fragment="matchCell(matching, quizSetId, memberId)">
    <div class="nowrap" th:each="c : ${matching.personalCandidates}">
        <a class="member-search-link" th:href="@{/admin/quiz-sets/{id}/participants(id=${quizSetId},q=|#${c.otherMemberId}|)}"
           th:text="|${c.otherNickname ?: '삭제된 회원'} (#${c.otherMemberId})|">닉네임 (#2)</a>
        <span class="muted" th:text="|${#numbers.formatDecimal(c.score, 1, 1)} (${c.matchedQuestionCount}/${c.totalQuestionCount})|">66.7 (2/3)</span>
        <span th:if="${c.requestState != null}" th:class="${c.requestState.tone.cssClass}" th:text="${c.requestState.label}">신청함</span>
    </div>
    <div class="nowrap" th:each="r : ${matching.outsideRequests}">
        <span class="muted">후보 밖:</span>
        <a class="member-search-link" th:href="@{/admin/quiz-sets/{id}/participants(id=${quizSetId},q=|#${r.otherMemberId}|)}"
           th:text="|${r.otherNickname ?: '삭제된 회원'} (#${r.otherMemberId})|">닉네임 (#2)</a>
        <span th:class="${r.requestState.tone.cssClass}" th:text="${r.requestState.label}">성사</span>
    </div>
    <div class="match-group" th:each="g : ${matching.groupCandidates}">
        <div class="match-group-head">
            <span th:text="|그룹 #${g.groupMatchId} · ${#numbers.formatDecimal(g.score, 1, 1)} · 수락 ${g.acceptedCount}/${g.activationThreshold}|">그룹 #1 · 75.0 · 수락 1/3</span>
            <span class="badge on" th:if="${g.isFormed}">성사</span>
            <span class="muted">나</span>
            <span th:class="${g.myResponse.tone.cssClass}" th:text="${g.myResponse.label}">대기</span>
        </div>
        <div class="muted match-group-member" th:each="o : ${g.otherMembers}">
            <a class="member-search-link" th:href="@{/admin/quiz-sets/{id}/participants(id=${quizSetId},q=|#${o.memberId}|)}"
               th:text="|${o.nickname ?: '삭제된 회원'} (#${o.memberId})|">닉네임 (#2)</a>
            <span th:class="${o.response.tone.cssClass}" th:text="${o.response.label}">대기</span>
        </div>
    </div>
    <th:block th:if="${matching.miss != null}" th:with="reason=${matching.miss.reason}">
        <span th:class="${reason.emphasis.cssClass}" th:text="${reason.label}">미완주</span>
        <span class="muted" th:if="${matching.miss.scoreGap != null}" th:text="|(${matching.miss.scoreGap})|">(최고 0.0 &lt; 컷 100.0)</span>
        <th:block th:if="${reason.nextAction != null}">
            <div class="muted" th:if="${reason.linksToParticipants}">
                → <a class="text-link" th:href="@{/admin/quiz-sets/{id}/participants(id=${quizSetId},q=|#${memberId}|)}" th:text="${reason.nextAction}">참여 현황에서 이유 보기</a>
            </div>
            <div class="muted" th:unless="${reason.linksToParticipants}" th:text="|→ ${reason.nextAction}|">→ 다음 조치</div>
        </th:block>
    </th:block>
</th:block>
</body>
</html>
