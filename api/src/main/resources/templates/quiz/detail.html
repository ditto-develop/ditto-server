<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('퀴즈셋 상세')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments :: sidebar('quiz')}"></aside>
    <div class="main-wrap">
        <header th:replace="~{fragments :: topbar}"></header>
        <main class="content">
            <a class="muted" th:href="@{/admin/quiz-sets}">← 목록</a>
            <h1 class="page-title" style="margin-top:8px" th:text="${quizSet.title}">제목</h1>
            <p class="page-desc">
                <span th:text="${@weekLabel.of(quizSet.weekStartedOn)}">-</span> ·
                <span class="badge cat" th:text="${quizSet.category}">cat</span>
                <span class="badge on" th:if="${quizSet.isActive}">활성</span>
                <span class="badge off" th:unless="${quizSet.isActive}">비활성</span>
            </p>
            <div th:replace="~{fragments :: alerts}"></div>

            <div class="card">
                <div class="btn-row">
                    <a class="btn" th:href="@{/admin/quiz-sets/{id}/edit(id=${quizSet.id})}">정보·문항 수정</a>
                    <form class="inline-form" th:if="${!quizSet.isActive}" th:action="@{/admin/quiz-sets/{id}/activate(id=${quizSet.id})}" method="post">
                        <button class="btn secondary" type="submit">활성화</button>
                    </form>
                    <form class="inline-form" th:if="${quizSet.isActive}" th:action="@{/admin/quiz-sets/{id}/deactivate(id=${quizSet.id})}" method="post">
                        <button class="btn secondary" type="submit">비활성화</button>
                    </form>
                    <form class="inline-form" th:action="@{/admin/quiz-sets/{id}/delete(id=${quizSet.id})}" method="post"
                          onsubmit="return confirm('퀴즈셋과 하위 퀴즈·선택지를 모두 삭제합니다. 계속할까요?');">
                        <button class="btn danger" type="submit">삭제</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <h2>문항 <span class="muted" th:text="'(' + ${#lists.size(quizzes)} + ')'">(0)</span></h2>
                <p class="muted" th:if="${#lists.isEmpty(quizzes)}" style="margin:0">
                    문항이 없습니다. 위 <b>정보·문항 수정</b>에서 추가하세요.
                </p>
                <div class="ro-quiz" th:each="quiz, stat : ${quizzes}">
                    <span class="no" th:text="${stat.index + 1}">1</span>
                    <div style="min-width:0">
                        <div class="q" th:text="${quiz.question}">질문</div>
                        <div class="cs">
                            <span th:each="choice : ${choicesByQuiz.getOrDefault(quiz.id, {})}" th:text="${choice.content}">선택지</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
