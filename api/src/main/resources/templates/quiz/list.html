<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('퀴즈셋 관리')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments :: sidebar('quiz')}"></aside>
    <div class="main-wrap">
        <header th:replace="~{fragments :: topbar}"></header>
        <main class="content">
            <div class="btn-row" style="justify-content: space-between;">
                <div>
                    <h1 class="page-title">퀴즈셋 관리</h1>
                    <p class="page-desc">주차별 퀴즈셋을 등록·수정·삭제합니다.</p>
                </div>
                <a class="btn" th:href="@{/admin/quiz-sets/new}">+ 새 퀴즈셋</a>
            </div>
            <div th:replace="~{fragments :: alerts}"></div>

            <div class="card">
                <p class="muted" th:if="${quizSets.isEmpty()}">등록된 퀴즈셋이 없습니다.</p>
                <table class="tbl" th:unless="${quizSets.isEmpty()}">
                    <thead>
                    <tr>
                        <th>주차</th><th>카테고리</th><th>제목</th><th>매칭</th><th>기간</th><th>상태</th><th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="qs : ${quizSets}">
                        <td class="num" th:text="${@weekLabel.of(qs.year, qs.month, qs.week)}">-</td>
                        <td><span class="badge cat" th:text="${qs.category}">cat</span></td>
                        <td th:text="${qs.title}">title</td>
                        <td class="num" th:text="${qs.matchingType}">type</td>
                        <td class="num"
                            th:text="${#temporals.format(qs.startDate, 'MM.dd')} + ' ~ ' + ${#temporals.format(qs.endDate, 'MM.dd')}">-</td>
                        <td>
                            <span class="badge on" th:if="${qs.isActive}">활성</span>
                            <span class="badge off" th:unless="${qs.isActive}">비활성</span>
                        </td>
                        <td><a class="btn secondary sm" th:href="@{/admin/quiz-sets/{id}(id=${qs.id})}">관리</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
