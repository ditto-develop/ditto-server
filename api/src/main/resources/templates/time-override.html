<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('시간 조정')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments :: sidebar('time')}"></aside>
    <div class="main-wrap">
        <header th:replace="~{fragments :: topbar}"></header>
        <main class="content">
            <h1 class="page-title">시간 조정</h1>
            <p class="page-desc">서버가 사용할 "현재 시각"을 임의로 설정합니다. 실회원을 포함한 모든 회원에게 적용되니 QA가 끝나면 바로 끄세요. 끄면 실제 시각을 사용합니다.</p>
            <div th:replace="~{fragments :: alerts}"></div>

            <div class="grid cols-2">
                <div class="card stat">
                    <span class="label">현재 적용 중인 서버 시각</span>
                    <span class="value" style="font-size:20px" th:text="${#temporals.format(currentTime, 'yyyy-MM-dd HH:mm')}">-</span>
                    <span>
                        <span class="badge danger" th:if="${override.enabled}">조정 중</span>
                        <span class="badge neutral" th:unless="${override.enabled}">실제 시각</span>
                        <th:block th:switch="${state.period.name()}">
                            <span th:case="'QUIZ_PERIOD'" class="badge quiz">퀴즈 기간(월~수)</span>
                            <span th:case="'MATCHING_PERIOD'" class="badge matching">매칭 기간(목)</span>
                            <span th:case="*" class="badge chatting">채팅 기간(금~일)</span>
                        </th:block>
                    </span>
                </div>
                <div class="card stat">
                    <span class="label">마지막 설정자</span>
                    <span class="value" style="font-size:16px"
                          th:text="${override.enabled and override.authorName != null} ? (${override.authorName} + (${override.authorEmail != null} ? ' (' + ${override.authorEmail} + ')' : '')) : '—'">—</span>
                </div>
            </div>

            <div class="card">
                <h2 class="with-info">시각 설정
                    <th:block th:replace="~{fragments :: info('info-time-override', '시각 설정', '설정한 시각은 흐르지 않고 그 자리에 멈춰 있습니다. 금 00:00(그룹 응답 마감)이나 다음 주 월 00:00(채팅 마감·평가 열림)을 넘기면 1분 안에 마감 처리가 자동으로 돌아 되돌릴 수 없습니다.')}"></th:block></h2>
                <form id="timeOverrideForm" th:action="@{/admin/time-override}" method="post" class="field-row" style="align-items:flex-end"
                      th:attr="data-now=${#temporals.format(timeMoveGuide.now, 'yyyy-MM-dd''T''HH:mm')},
                               data-group-deadline=${#temporals.format(timeMoveGuide.groupDeadline, 'yyyy-MM-dd''T''HH:mm')},
                               data-chat-end=${#temporals.format(timeMoveGuide.chatEnd, 'yyyy-MM-dd''T''HH:mm')},
                               data-back-to-past=${timeMoveGuide.backToPastMessage},
                               data-past-group-deadline=${timeMoveGuide.groupDeadlineMessage},
                               data-past-chat-end=${timeMoveGuide.chatEndMessage},
                               data-irreversible=${timeMoveGuide.irreversibleNotice}">
                    <div class="field">
                        <label for="dateTime">서버 시각</label>
                        <input type="datetime-local" id="dateTime" name="dateTime" required
                               th:value="${#temporals.format(currentTime, 'yyyy-MM-dd''T''HH:mm')}"/>
                    </div>
                    <div class="field"><button class="btn" type="submit">이 시각으로 설정</button></div>
                </form>
                <hr class="sep"/>
                <form th:action="@{/admin/time-override/disable}" method="post" class="inline-form"
                      th:attr="data-confirm=${timeMoveGuide.disableConfirmMessage}"
                      onsubmit="return !this.dataset.confirm || confirm(this.dataset.confirm);">
                    <button class="btn secondary" type="submit">시간 조정 끄기</button>
                </form>
            </div>
        </main>
    </div>
</div>
<script>
    // QA 콘솔의 QaTimeMoveWarning 과 같은 기준이다. 마감을 넘기거나 지난 시점으로 갈 때만 묻는다.
    document.getElementById('timeOverrideForm').addEventListener('submit', (event) => {
        const form = event.currentTarget;
        const { now, groupDeadline, chatEnd } = form.dataset;
        const target = form.dateTime.value;
        const crosses = (boundary) => now < boundary && target >= boundary;
        const warnings = target < now
            ? [form.dataset.backToPast]
            : [crosses(groupDeadline) && form.dataset.pastGroupDeadline, crosses(chatEnd) && form.dataset.pastChatEnd].filter(Boolean);
        if (warnings.length === 0) return;
        const irreversible = target < now ? [] : [form.dataset.irreversible];
        if (!window.confirm([...warnings, ...irreversible, '옮길까요?'].join(' '))) event.preventDefault();
    });
</script>
</body>
</html>
