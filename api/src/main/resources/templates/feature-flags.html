<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('기능 플래그')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments :: sidebar('feature-flag')}"></aside>
    <div class="main-wrap">
        <header th:replace="~{fragments :: topbar}"></header>
        <main class="content">
            <h1 class="page-title">기능 플래그</h1>
            <p class="page-desc">서버 기능을 기능별로 켜고 끕니다. 실회원 전원에게 바로 적용됩니다.
                서버마다 <span th:text="${cacheMinutes}">1</span>분씩 기억해 두므로, 바꾼 값이 모든 서버에 퍼지기까지 최대 <span th:text="${cacheMinutes}">1</span>분 걸립니다.</p>
            <div th:replace="~{fragments :: alerts}"></div>

            <div class="card">
                <div class="tbl-scroll">
                    <table class="tbl">
                        <thead>
                        <tr><th>플래그</th><th>설명</th><th>상태</th><th>켠 시각</th><th>마지막 변경</th><th></th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="f : ${flags}">
                            <td><code th:text="${f.key}">QUIZ_CHAT</code></td>
                            <td th:text="${f.key.description}">설명</td>
                            <td>
                                <span class="badge danger" th:if="${f.enabled}">켜짐</span>
                                <span class="badge neutral" th:unless="${f.enabled}">꺼짐</span>
                            </td>
                            <td class="num" th:text="${f.enabledAt != null} ? ${#temporals.format(f.enabledAt, 'yy-MM-dd HH:mm')} : '-'">-</td>
                            <td class="num" th:text="${f.updatedAt != null} ? (${#temporals.format(f.updatedAt, 'yy-MM-dd HH:mm')} + ' · 회원 #' + ${f.updatedByMemberId}) : '-'">-</td>
                            <td>
                                <form th:action="@{/admin/feature-flags/{key}(key=${f.key})}" method="post" class="inline-form"
                                      th:attr="data-confirm=${f.enabled} ? (${f.key} + ' 를 끕니다. 실회원 전원에게 바로 적용됩니다.') : (${f.key} + ' 를 켭니다. 실회원 전원에게 바로 적용됩니다.')"
                                      onsubmit="return confirm(this.dataset.confirm);">
                                    <input type="hidden" name="enabled" th:value="${!f.enabled}"/>
                                    <button class="btn" type="submit" th:classappend="${f.enabled} ? 'secondary'"
                                            th:text="${f.enabled} ? '끄기' : '켜기'">켜기</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
