<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' · Ditto Admin'">Ditto Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
    <link rel="stylesheet" th:href="@{/admin/css/admin.css}"/>
</head>
<body>

<aside th:fragment="sidebar(active)" class="sidebar">
    <div class="brand">Ditto<span>.</span>admin</div>
    <nav class="nav">
        <div class="nav-group">
            <span class="nav-title">현황</span>
            <a th:href="@{/admin}" th:classappend="${active == 'dashboard'} ? 'active'"><span class="ico">🏠</span> 대시보드</a>
            <a th:href="@{/admin/stats}" th:classappend="${active == 'stats'} ? 'active'"><span class="ico">📊</span> 운영 지표</a>
        </div>
        <div class="nav-group">
            <span class="nav-title">퀴즈·매칭</span>
            <a th:href="@{/admin/quiz-sets}" th:classappend="${active == 'quiz'} ? 'active'"><span class="ico">📝</span> 퀴즈셋 관리</a>
            <a th:href="@{/admin/matching}" th:classappend="${active == 'matching'} ? 'active'"><span class="ico">💞</span> 매칭 수동 실행</a>
        </div>
        <div class="nav-group">
            <span class="nav-title">회원·안전</span>
            <a th:href="@{/admin/members}" th:classappend="${active == 'member'} ? 'active'"><span class="ico">👤</span> 회원 관리</a>
            <a th:href="@{/admin/reports}" th:classappend="${active == 'report'} ? 'active'"><span class="ico">🚨</span> 신고 검토</a>
        </div>
        <div class="nav-group">
            <span class="nav-title">소통</span>
            <a th:href="@{/admin/feedbacks}" th:classappend="${active == 'feedback'} ? 'active'"><span class="ico">💬</span> 의견 확인</a>
            <a th:href="@{/admin/notices}" th:classappend="${active == 'notice'} ? 'active'"><span class="ico">📢</span> 시스템 공지</a>
            <a th:href="@{/admin/launch-notifications}" th:classappend="${active == 'launch-notification'} ? 'active'"><span class="ico">📮</span> 출시 알림 신청자(웹)</a>
        </div>
        <div class="nav-group qa" th:if="${qaToolsEnabled}">
            <span class="nav-title">QA 전용 · 실서비스에서는 꺼짐</span>
            <a th:href="@{/admin/time-override}" th:classappend="${active == 'time'} ? 'active'"><span class="ico">⏱️</span> 시간 조정</a>
            <a th:href="@{/admin/dummy}" th:classappend="${active == 'dummy'} ? 'active'"><span class="ico">🧪</span> 더미 관리</a>
            <a th:href="@{/admin/qa}" th:classappend="${active == 'qa'} ? 'active'"><span class="ico">🕹️</span> QA 콘솔</a>
        </div>
    </nav>
</aside>

<header th:fragment="topbar" class="topbar">
    <a class="badge danger" th:if="${timeOverrideAt != null}" th:href="@{/admin/time-override}"
       th:text="|시간 조정 중 · ${#temporals.format(timeOverrideAt, 'yyyy-MM-dd HH:mm')}|">시간 조정 중</a>
    <span class="with-info" th:if="${qaToolsEnabled}">
        <span class="badge warn">QA 도구 켜짐</span>
        <th:block th:replace="~{fragments :: info('info-qa-tools', 'QA 도구', '더미 관리, QA 콘솔, 시간 조정, 퀴즈셋 초기화를 쓸 수 있는 상태입니다. 여기서 한 작업도 실제 DB와 실회원에게 적용됩니다. 실서비스에서는 꺼야 하며, 끄려면 서버 담당자에게 ADMIN_QA_TOOLS_ENABLED 끄기를 요청하세요.')}"></th:block>
    </span>
    <span class="who" th:if="${admin != null}">
        <strong th:text="${admin.displayName}">관리자</strong> 님
    </span>
    <form th:action="@{/admin/logout}" method="post" class="inline-form">
        <button type="submit" class="btn secondary sm">로그아웃</button>
    </form>
</header>

<!-- 누르면 열리는 (i) 설명. 설명 상자는 popover 라 표 스크롤 상자 안에서도 잘리지 않는다. -->
<th:block th:fragment="info(id, label, text)"><button type="button" class="info-btn" th:attr="popovertarget=${id}"
        th:style="|anchor-name: --${id}|"><span aria-hidden="true">i</span><span class="sr-only" th:text="|${label} 설명|">설명</span></button><span
        th:id="${id}" popover class="info-pop" th:style="|position-anchor: --${id}|" th:text="${text}"></span></th:block>

<!-- 지표가 어느 기간을 세는지. 회차를 따르지 않는 now 는 점선 테두리로 모양부터 다르게 그린다. -->
<span th:fragment="scope(kind)" class="scope-badge" th:classappend="${kind}" th:switch="${kind}">
    <th:block th:case="'round'">이 회차</th:block>
    <th:block th:case="'week'">이 주 월~일</th:block>
    <th:block th:case="'now'">회차 무관 · 오늘 기준</th:block>
</span>
<span th:fragment="scopeRange(text)" class="scope-badge range" th:text="${text}">최근 4회차</span>

<div th:fragment="alerts">
    <div class="alert success" th:if="${message}" th:text="${message}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
</div>

</body>
</html>
