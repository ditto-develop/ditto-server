<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="roomType(type)" th:switch="${type.name()}">
    <span class="badge cat" th:case="'PERSONAL'">1:1</span>
    <span class="badge cat" th:case="'GROUP'">그룹</span>
    <span class="badge cat" th:case="'REMATCH'">재매칭</span>
    <span class="badge cat" th:case="*" th:text="${type}">유형</span>
</th:block>

<th:block th:fragment="endReason(reason)" th:switch="${reason?.name()}">
    <th:block th:case="'EXPIRED'">기한 만료</th:block>
    <th:block th:case="'USER_ENDED'">참여자가 종료</th:block>
    <th:block th:case="'INSUFFICIENT_MEMBERS'">인원 부족으로 해체</th:block>
    <th:block th:case="*" th:text="${reason}">사유</th:block>
</th:block>

<th:block th:fragment="voteCloseReason(reason)" th:switch="${reason?.name()}">
    <th:block th:case="'MEMBER'">참여자가 마감</th:block>
    <th:block th:case="'ROOM_ENDED'">방이 끝나 자동 마감</th:block>
    <th:block th:case="*" th:text="${reason}">사유</th:block>
</th:block>

<div class="qa-vote-group" th:fragment="voteOptions(title, inputName, options, allowMultiple)">
    <div class="qa-vote-title" th:text="${title}">장소</div>
    <label class="qa-vote-option" th:each="option : ${options}">
        <input th:type="${allowMultiple} ? 'checkbox' : 'radio'" th:name="${inputName}" th:value="${option.optionId}"/>
        <span th:text="${option.label}">성수 카페</span>
        <span class="qa-voters"
              th:text="${option.voters.isEmpty()} ? '' : |${option.voters.size()}표 · ${#strings.listJoin(option.voters.![nickname], ', ')}|"></span>
    </label>
</div>

<th:block th:fragment="rematchWants(wants)" th:switch="${wants}">
    <th:block th:case="true">원함</th:block>
    <th:block th:case="false">원하지 않음</th:block>
    <th:block th:case="*">아직 안 냄</th:block>
</th:block>

<th:block th:fragment="rematchStatus(pair)" th:switch="${pair.outcome?.name()}">
    <span class="badge on" th:case="'MATCHED'">성사</span>
    <span class="badge off" th:case="'NOT_MUTUAL'">불성사</span>
    <span class="badge off" th:case="'CANCELLED_BY_MEMBER_LEAVE'">탈퇴로 취소</span>
    <span class="badge matching" th:case="*">대기</span>
</th:block>

<th:block th:fragment="roomStatus(status)" th:switch="${status.name()}">
    <span class="badge matching" th:case="'SCHEDULED'">열리기 전</span>
    <span class="badge on" th:case="'ACTIVE'">진행 중</span>
    <span class="badge off" th:case="*">종료</span>
</th:block>

</body>
</html>
