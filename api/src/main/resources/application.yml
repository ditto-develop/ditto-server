spring:
  application:
    name: ditto-server
  task:
    scheduling:
      # 기본 1 이면 월 00:00 퀴즈 오픈(회원 전원 적재·푸시)이 도는 동안 매분 sweep 과 다른 cron 이 밀린다.
      # 스케줄러는 모두 멱등이라 겹쳐 돌아도 안전하다.
      pool:
        size: 3
      # 종료 신호를 받으면 실행 중인 크론(매칭·주간 푸시 등)이 끝나길 기다린다. 기본은 곧바로 끊는다 —
      # 주 1회 작업이 중간에 끊기면 다음 실행이 다음 주다(#361). ECS stopTimeout(60초) 안에 끝나도록 잡는다.
      shutdown:
        await-termination: true
        await-termination-period: 20s
  lifecycle:
    # 종료 단계마다 기다리는 상한(웹 서버의 처리 중 요청 등). 기본 30초는 ECS stopTimeout 기본값과 같아
    # 다 쓰면 뒤 단계(스케줄러 대기·DB 풀 정리) 전에 강제 종료된다. 위 대기와 합쳐 60초 안에 들게 한다.
    timeout-per-shutdown-phase: 20s
  profiles:
    active: local
    include:
      - oauth
      - db
      - storage
      - fcm

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # TLS 는 로드밸런서에서 끝나서 절대 주소로 만들면 http:// 가 된다. 어드민 비동기 폼의 fetch 가 그 리다이렉트를 따라가다 막힌다.
    use-relative-redirects: true

springdoc:
  swagger-ui:
    path: /docs
    url: /docs/openapi.yaml

ditto:
  security:
    api-key: test-api-key
  auth:
    cookie:
      secure: ${COOKIE_SECURE:false}
      same-site: Lax
      path: /api/v1/users/auth
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      # 애플 웹 로그인 콜백은 애플 도메인이 보내는 크로스사이트 폼 POST 라 Origin 이 애플 것이다.
      # 빼면 콜백이 컨트롤러 전에 403 Invalid CORS request 로 끊긴다. ADR 0030
      - https://appleid.apple.com
  jwt:
    secret: local-dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hmac-sha
    expiration-ms: 3600000
    refresh-expiration-ms: 1209600000
  chat:
    # 로컬 전용 키(Base64 32바이트). 운영은 Secrets Manager 에서 받는다.
    content-encryption-key: XmMGOL7lQ6UREHJbqkXd0VTYiSKNbjqC3U/AMTFDX/g=
  front:
    oauth-callback-url: ${FRONT_OAUTH_CALLBACK_URL:http://localhost:3000/auth/callback}
  admin:
    # 어드민 QA 도구(퀴즈셋 초기화·더미·QA 콘솔·시간 조정) 스위치. 실제 서비스 시작 전에 끈다(ADR 0039).
    # 로컬에서 QA 화면을 쓰려면 ADMIN_QA_TOOLS_ENABLED=true ./gradlew :api:bootRun
    qa-tools:
      enabled: ${ADMIN_QA_TOOLS_ENABLED:false}
  # App Store 심사용 데모 로그인. 둘 중 하나라도 비면 꺼진다. 비밀번호는 BCrypt 해시만 넣는다(레포 공개).
  review-login:
    login-id: ${REVIEW_LOGIN_ID:}
    password-hash: ${REVIEW_LOGIN_PASSWORD_HASH:}
