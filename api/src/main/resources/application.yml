spring:
  application:
    name: ditto-server
  task:
    scheduling:
      # 기본 1 이면 월 00:00 퀴즈 오픈(회원 전원 적재·푸시)이 도는 동안 매분 sweep 과 다른 cron 이 밀린다.
      # 서로 다른 크론이 한 인스턴스에서 동시에 돌아도 서로 간섭하지 않는다. 같은 크론이 인스턴스 사이에서
      # 겹치는 일은 @SchedulerLock 이 막는다(ADR 0049).
      pool:
        size: 3
      # 종료 신호를 받으면 실행 중인 크론(매칭·주간 푸시 등)이 끝나길 최대 20초 기다린다. 기본은 곧바로 끊는다 —
      # 주 1회 작업이 중간에 끊기면 다음 실행이 다음 주다(#361). 20초를 넘기는 작업은 여전히 끊긴다.
      shutdown:
        await-termination: true
        await-termination-period: 20s
  lifecycle:
    # 종료 단계(SmartLifecycle phase)마다 기다리는 상한. 오래 걸리는 단계는 웹 서버의 처리 중 요청 대기다.
    # 웹 서버 대기 20초 + 스케줄러 대기 20초(위) = 40초로 ECS stopTimeout(60초, .aws/task-definition.json) 안에 든다.
    # stopTimeout 을 바꾸면 두 값을 함께 맞춘다 — 넘기면 DB 풀 정리 전에 강제 종료된다.
    timeout-per-shutdown-phase: 20s
  profiles:
    active: local
    include:
      - oauth
      - db
      - storage
      - fcm

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # TLS 는 로드밸런서에서 끝나서 절대 주소로 만들면 http:// 가 된다. 어드민 비동기 폼의 fetch 가 그 리다이렉트를 따라가다 막힌다.
    use-relative-redirects: true

logging:
  level:
    # 락에 막혀 크론을 건너뛰면 "Not executing '<이름>'. It's locked." 를 남긴다(이 로거는 DEBUG 로만 찍는다).
    # 그게 없으면 크론이 안 돈 이유가 락인지 cron 설정인지 로그로 가를 수 없다. 획득·해제도 함께 찍혀 매분 두어 줄 늘어난다.
    net.javacrumbs.shedlock.core.DefaultLockingTaskExecutor: DEBUG

springdoc:
  swagger-ui:
    path: /docs
    url: /docs/openapi.yaml

ditto:
  security:
    api-key: test-api-key
  auth:
    cookie:
      secure: ${COOKIE_SECURE:false}
      same-site: Lax
      path: /api/v1/users/auth
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      # 애플 웹 로그인 콜백은 애플 도메인이 보내는 크로스사이트 폼 POST 라 Origin 이 애플 것이다.
      # 빼면 콜백이 컨트롤러 전에 403 Invalid CORS request 로 끊긴다. ADR 0030
      - https://appleid.apple.com
  jwt:
    secret: local-dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hmac-sha
    expiration-ms: 3600000
    refresh-expiration-ms: 1209600000
  chat:
    # 로컬 전용 키(Base64 32바이트). 운영은 Secrets Manager 에서 받는다.
    content-encryption-key: XmMGOL7lQ6UREHJbqkXd0VTYiSKNbjqC3U/AMTFDX/g=
  front:
    oauth-callback-url: ${FRONT_OAUTH_CALLBACK_URL:http://localhost:3000/auth/callback}
  admin:
    # 어드민 QA 도구(퀴즈셋 초기화·더미·QA 콘솔·시간 조정) 스위치. 실제 서비스 시작 전에 끈다(ADR 0039).
    # 로컬에서 QA 화면을 쓰려면 ADMIN_QA_TOOLS_ENABLED=true ./gradlew :api:bootRun
    qa-tools:
      enabled: ${ADMIN_QA_TOOLS_ENABLED:false}
  # App Store 심사용 데모 로그인. 둘 중 하나라도 비면 꺼진다. 비밀번호는 BCrypt 해시만 넣는다(레포 공개).
  review-login:
    login-id: ${REVIEW_LOGIN_ID:}
    password-hash: ${REVIEW_LOGIN_PASSWORD_HASH:}
