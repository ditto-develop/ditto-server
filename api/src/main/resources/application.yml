spring:
  application:
    name: ditto-server
  profiles:
    active: local
    include:
      - oauth
      - db

server:
  port: 8080
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /docs
    url: /docs/openapi.yaml

ditto:
  security:
    api-key: test-api-key
  cors:
    # TODO(#54): 웹 프론트 dev origin 확정 필요
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  jwt:
    secret: local-dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hmac-sha
    expiration-ms: 3600000
    refresh-expiration-ms: 1209600000
