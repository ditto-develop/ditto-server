spring:
  application:
    name: ditto-server
  task:
    scheduling:
      # 기본 1 이면 월 00:00 퀴즈 오픈(회원 전원 적재·푸시)이 도는 동안 매분 sweep 과 다른 cron 이 밀린다.
      # 스케줄러는 모두 멱등이라 겹쳐 돌아도 안전하다.
      pool:
        size: 3
  profiles:
    active: local
    include:
      - oauth
      - db
      - storage
      - fcm

server:
  port: 8080
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /docs
    url: /docs/openapi.yaml

ditto:
  security:
    api-key: test-api-key
  auth:
    cookie:
      secure: ${COOKIE_SECURE:false}
      same-site: Lax
      path: /api/v1/users/auth
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      # 애플 웹 로그인 콜백은 애플 도메인이 보내는 크로스사이트 폼 POST 라 Origin 이 애플 것이다.
      # 빼면 콜백이 컨트롤러 전에 403 Invalid CORS request 로 끊긴다. ADR 0030
      - https://appleid.apple.com
  jwt:
    secret: local-dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hmac-sha
    expiration-ms: 3600000
    refresh-expiration-ms: 1209600000
  front:
    oauth-callback-url: ${FRONT_OAUTH_CALLBACK_URL:http://localhost:3000/auth/callback}
