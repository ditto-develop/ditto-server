openapi: 3.0.1
info:
  title: Ditto API
  description: |-
    Ditto 서비스 API 문서입니다.

    ## 인증
    모든 API 요청에는 `X-API-Key` 헤더가 필요합니다.
    API Key는 백엔드 담당자에게 발급받으세요.

    ```
    X-API-Key: <발급받은 API Key>
    ```

    Swagger UI에서 테스트하려면 우측 상단의 **Authorize** 버튼을 클릭하고 API Key를 입력하세요.
  version: v1
servers:
- url: ""
tags: []
paths:
  /api/v1/user-reports:
    post:
      tags:
      - UserReports
      summary: 신고 접수
      description: 상대 회원을 신고합니다. 자기 신고·검토 대기 중인 동일 대상 재신고는 거부됩니다. 이미지는 업로드 URL 발급
        API로 업로드를 마친 objectKey를 전달합니다.
      operationId: user-report-create
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-v1-user-reports1863970767"
            examples:
              user-report-create:
                value: |-
                  {
                    "reportedMemberId" : 2,
                    "reason" : "inappropriate-behavior",
                    "source" : "profile",
                    "detail" : "대화 중 폭언을 반복했습니다.",
                    "imageKeys" : [ "pending/user-reports/1/bce43709-d5d9-4356-93e3-4904eefae2c7" ]
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-user-reports900126493"
              examples:
                user-report-create:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : 1
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/users:
    post:
      tags:
      - Users
      summary: 회원가입
      description: 소셜 로그인 후 추가 정보를 입력하여 회원가입을 완료합니다.
      operationId: user-register
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-v1-users-2041696623"
            examples:
              user-register:
                value: |-
                  {
                    "name" : "김철수",
                    "nickname" : "철수123",
                    "phoneNumber" : "010-1234-5678",
                    "email" : null,
                    "gender" : "MALE",
                    "age" : 25,
                    "birthDate" : null,
                    "interests" : [ "travel", "music" ],
                    "location" : "seoul",
                    "job" : "it-tech",
                    "caricature" : "m1"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-1640911349"
              examples:
                user-register:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : 1,
                        "name" : "김철수",
                        "nickname" : "철수123",
                        "phoneNumber" : "010-1234-5678",
                        "email" : null,
                        "gender" : "MALE",
                        "age" : 25,
                        "birthDate" : null,
                        "interests" : [ "music", "travel" ],
                        "location" : "seoul",
                        "job" : "it-tech",
                        "caricature" : "m1",
                        "joinedAt" : "2026-07-18 00:23:14",
                        "role" : null,
                        "createdAt" : "2026-07-18 00:23:14",
                        "updatedAt" : "2026-07-18 00:23:14"
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/matches/1on1:
    get:
      tags:
      - Matching
      summary: 1:1 매칭 추천 후보 목록 조회
      description: "회원이 최근 완료한 1:1 퀴즈셋의 추천 후보를 매칭 점수 내림차순으로 조회합니다. 대상 퀴즈셋은 서버가 결정하\
        며, 응답의 quizSetId 로 확인합니다."
      operationId: match-candidate-list
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-matches-1on1-1115011008"
              examples:
                match-candidate-list:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "quizSetId" : 10,
                        "matchingType" : "ONE_TO_ONE",
                        "algorithmVersion" : "1.0",
                        "candidates" : [ {
                          "userId" : 2,
                          "nickname" : "디토",
                          "gender" : "FEMALE",
                          "age" : 27,
                          "introduction" : "한 단어로 표현하면 디토",
                          "location" : "seoul",
                          "profileImageUrl" : "f1",
                          "matchRate" : 87.5,
                          "scoreBreakdown" : {
                            "quizMatchRate" : 87.5,
                            "matchedQuestions" : 7,
                            "totalQuestions" : 8,
                            "reasons" : [ "전체 8문항 중 7문항이 일치했어요" ]
                          }
                        } ]
                      },
                      "error" : null
                    }
  /api/v1/matches/request:
    post:
      tags:
      - Matching
      summary: 1:1 매칭 요청
      description: 상대방에게 1:1 매칭을 요청합니다.
      operationId: personal-match-request
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-matches-request-793255208"
            examples:
              personal-match-request:
                value: |-
                  {
                    "receiverId" : 2,
                    "quizSetId" : 10
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-matches-request-1327932902"
              examples:
                personal-match-request:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : 1,
                        "quizSetId" : 10,
                        "requesterId" : 1,
                        "receiverId" : 2,
                        "status" : "PENDING",
                        "createdAt" : "2026-05-01 12:00:00",
                        "respondedAt" : null
                      },
                      "error" : null
                    }
  /api/v1/quiz-progress/answers:
    post:
      tags:
      - QuizProgress
      summary: 퀴즈 답안 제출
      description: 퀴즈에 대한 답안을 제출합니다. 이미 답변한 퀴즈에 재제출하면 선택지가 업데이트됩니다.
      operationId: quiz-progress-submit-answer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-quiz-progress-answers-1062387050"
            examples:
              quiz-progress-submit-answer:
                value: |-
                  {
                    "quizId" : 1,
                    "choiceId" : 2
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-auth-logout-1831456372"
              examples:
                quiz-progress-submit-answer:
                  value: |-
                    {
                      "success" : true,
                      "data" : null,
                      "error" : null
                    }
  /api/v1/quiz-progress/current:
    get:
      tags:
      - QuizProgress
      summary: 퀴즈 진행률 조회
      description: 현재 주차의 퀴즈 진행 상태를 조회합니다.
      operationId: quiz-progress-current
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-quiz-progress-current1012077415"
              examples:
                quiz-progress-current:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "status" : "COMPLETED",
                        "quizSetId" : 1,
                        "quizSetTitle" : "테스트 퀴즈셋",
                        "totalQuizzes" : 1,
                        "answeredQuizzes" : 1,
                        "participantCount" : 1
                      },
                      "error" : null
                    }
  /api/v1/quiz-progress/reset:
    post:
      tags:
      - QuizProgress
      summary: 퀴즈 진행 초기화
      description: 이번 주차의 퀴즈 답변과 진행 상태를 모두 초기화합니다.
      operationId: quiz-progress-reset
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-auth-logout-1831456372"
              examples:
                quiz-progress-reset:
                  value: |-
                    {
                      "success" : true,
                      "data" : null,
                      "error" : null
                    }
  /api/v1/quiz-sets/current-week:
    get:
      tags:
      - QuizSet
      summary: 이번 주차 퀴즈 세트 조회
      description: 현재 활성화된 이번 주차의 퀴즈 세트를 퀴즈 목록과 함께 조회합니다.
      operationId: quiz-set-current-week
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-quiz-sets-current-week-523790867"
              examples:
                quiz-set-current-week:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "year" : 2026,
                        "month" : 7,
                        "week" : 3,
                        "quizSets" : [ {
                          "id" : 1,
                          "year" : 2026,
                          "month" : 4,
                          "week" : 2,
                          "category" : "성격",
                          "title" : "이번 주 1:1 매칭",
                          "description" : "테스트 퀴즈 세트 설명",
                          "startDate" : "2026-07-17 00:23:14",
                          "endDate" : "2026-07-19 00:23:14",
                          "isActive" : true,
                          "matchingType" : "ONE_TO_ONE",
                          "quizzes" : [ {
                            "id" : 1,
                            "question" : "짜장면 vs 짬뽕?",
                            "quizSetId" : 1,
                            "choices" : [ {
                              "id" : 1,
                              "content" : "짜장면",
                              "order" : 1
                            }, {
                              "id" : 2,
                              "content" : "짬뽕",
                              "order" : 2
                            } ],
                            "order" : 1,
                            "createdAt" : "2026-07-18 00:23:14",
                            "updatedAt" : "2026-07-18 00:23:14"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/quiz-sets/{id}:
    get:
      tags:
      - QuizSet
      summary: 퀴즈 세트 단건 조회
      description: ID로 퀴즈 세트 메타데이터를 조회합니다.
      operationId: quiz-set-get
      parameters:
      - name: id
        in: path
        description: ""
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-quiz-sets-id1440540832"
              examples:
                quiz-set-get:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : 1,
                        "year" : 2026,
                        "month" : 4,
                        "week" : 2,
                        "category" : "성격",
                        "title" : "이번 주 1:1 매칭",
                        "description" : "테스트 퀴즈 세트 설명",
                        "startDate" : "2026-04-06 00:00:00",
                        "endDate" : "2026-04-12 23:59:59",
                        "isActive" : true,
                        "matchingType" : "ONE_TO_ONE",
                        "createdAt" : "2026-07-18 00:23:14",
                        "updatedAt" : "2026-07-18 00:23:14"
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/system/state:
    get:
      tags:
      - System
      summary: 시스템 상태 조회
      description: "현재 서버 시각 기준의 연/월/주차/기간(QUIZ_PERIOD, MATCHING_PERIOD, CHATTING_PERIOD)을\
        \ 조회합니다. 어드민 시각 오버라이드가 반영됩니다."
      operationId: system-state
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-system-state583099728"
              examples:
                system-state:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "year" : 2026,
                        "month" : 7,
                        "week" : 3,
                        "period" : "CHATTING_PERIOD"
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/user-reports/image-upload-urls:
    post:
      tags:
      - UserReports
      summary: 신고 이미지 업로드 URL 발급
      description: "신고에 첨부할 이미지의 업로드 URL(presigned PUT)을 발급합니다. 최대 3장, 파일당 5MB 이하\
        . 발급받은 uploadUrl로 파일을 PUT 업로드한 뒤 신고 접수 시 objectKey를 전달합니다. URL은 발급 후 10분간\
        \ 유효합니다."
      operationId: user-report-image-upload-urls
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-v1-user-reports-image-upload-urls-295231345"
            examples:
              user-report-image-upload-urls:
                value: |-
                  {
                    "files" : [ {
                      "contentType" : "image/png",
                      "contentLength" : 1024
                    }, {
                      "contentType" : "image/jpeg",
                      "contentLength" : 2048
                    } ]
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-user-reports-image-upload-urls-641010299"
              examples:
                user-report-image-upload-urls:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "uploads" : [ {
                          "objectKey" : "pending/user-reports/1/670e4f8b-8fcf-418f-ad1c-73fe8472b131",
                          "uploadUrl" : "https://fake-storage.local/pending/user-reports/1/670e4f8b-8fcf-418f-ad1c-73fe8472b131"
                        }, {
                          "objectKey" : "pending/user-reports/1/3fe9a1d4-ae75-4fba-9f62-0153407e5deb",
                          "uploadUrl" : "https://fake-storage.local/pending/user-reports/1/3fe9a1d4-ae75-4fba-9f62-0153407e5deb"
                        } ]
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/users/me:
    get:
      tags:
      - Users
      summary: 가입 정보 조회
      description: "소셜 로그인에서 받아온 가입 정보(이메일·생년월일·이름·전화번호·성별)를 조회합니다. 온보딩 화면 prefill\
        \ 용도이며, 가입 미완료(PENDING) 회원도 접근할 수 있습니다."
      operationId: user-me
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-me861338172"
              examples:
                user-me:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "email" : "user@kakao.com",
                        "birthDate" : "1995-03-15",
                        "name" : "홍길동",
                        "phoneNumber" : "010-1234-5678",
                        "gender" : "MALE"
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/matches/group/decline:
    post:
      tags:
      - Matching
      summary: 그룹 매칭 거절
      description: 그룹 매칭 참여를 거절합니다. 한 퀴즈셋당 한 번만 거절할 수 있습니다.
      operationId: group-match-decline
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-matches-group-join-1969670024"
            examples:
              group-match-decline:
                value: |-
                  {
                    "quizSetId" : 10
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-matches-group-decline-789252668"
              examples:
                group-match-decline:
                  value: |-
                    {
                      "success" : true,
                      "data" : null,
                      "error" : null
                    }
  /api/v1/matches/group/join:
    post:
      tags:
      - Matching
      summary: 그룹 매칭 참여
      description: |-
        그룹 매칭에 참여합니다.

        - 참여 가능한 방이 있으면 기존 방에 배정됩니다.
        - 참여 가능한 방이 없으면 새 방을 생성합니다.
        - 참여자가 3명이 되면 방이 활성화(isActive=true)됩니다.
      operationId: group-match-join
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-matches-group-join-1969670024"
            examples:
              group-match-join:
                value: |-
                  {
                    "quizSetId" : 10
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-matches-group-join-2080112672"
              examples:
                group-match-join:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "roomId" : 1,
                        "quizSetId" : 10,
                        "participantCount" : 1,
                        "isActive" : false
                      },
                      "error" : null
                    }
  /api/v1/matching/status/{quizSetId}:
    get:
      tags:
      - Matching
      summary: 매칭 상태 조회
      description: |-
        퀴즈셋에 대한 나의 매칭 현황을 조회합니다.

        - **sentRequests / receivedRequests**: 내가 보낸/받은 1:1 매칭 요청 목록
        - **hasAcceptedMatch / acceptedMatchUserId**: 수락된 1:1 매칭 보유 여부와 상대 ID
        - **groupDeclined / groupJoined / groupJoinPending**: 그룹 매칭 거절 / 활성 방 참여 / 인원 대기 상태
      operationId: matching-status
      parameters:
      - name: quizSetId
        in: path
        description: 퀴즈 세트 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-matching-status-quizSetId414593137"
              examples:
                matching-status:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "quizSetId" : 10,
                        "sentRequests" : [ {
                          "id" : 1,
                          "quizSetId" : 10,
                          "requesterId" : 1,
                          "receiverId" : 2,
                          "status" : "ACCEPTED",
                          "createdAt" : "2026-05-01 12:00:00",
                          "respondedAt" : "2026-05-01 12:30:00"
                        } ],
                        "receivedRequests" : [ {
                          "id" : 2,
                          "quizSetId" : 10,
                          "requesterId" : 3,
                          "receiverId" : 1,
                          "status" : "PENDING",
                          "createdAt" : "2026-05-01 12:00:00",
                          "respondedAt" : null
                        } ],
                        "hasAcceptedMatch" : true,
                        "acceptedMatchUserId" : 2,
                        "groupDeclined" : false,
                        "groupJoined" : true,
                        "groupJoinPending" : false
                      },
                      "error" : null
                    }
  /api/v1/quiz-progress/quiz-sets/{id}:
    get:
      tags:
      - QuizProgress
      summary: 퀴즈셋 + 답변 조회
      description: 퀴즈셋의 문제 목록과 사용자의 답변을 함께 조회합니다. 이어풀기에 사용됩니다.
      operationId: quiz-progress-quiz-set-with-progress
      parameters:
      - name: id
        in: path
        description: ""
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-quiz-progress-quiz-sets-id-1569645469"
              examples:
                quiz-progress-quiz-set-with-progress:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "quizzes" : [ {
                          "id" : 1,
                          "question" : "첫번째",
                          "quizSetId" : 1,
                          "choices" : [ {
                            "id" : 1,
                            "content" : "A",
