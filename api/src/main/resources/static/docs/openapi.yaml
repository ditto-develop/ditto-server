openapi: 3.0.1
info:
  title: Ditto API
  description: |-
    Ditto 서비스 API 문서입니다.

    ## 인증
    모든 API 요청에는 `X-API-Key` 헤더가 필요합니다.
    API Key는 백엔드 담당자에게 발급받으세요.

    ```
    X-API-Key: <발급받은 API Key>
    ```

    Swagger UI에서 테스트하려면 우측 상단의 **Authorize** 버튼을 클릭하고 API Key를 입력하세요.
  version: v1
servers:
- url: ""
tags: []
paths:
  /api/v1/users:
    post:
      tags:
      - Users
      summary: 회원가입
      description: 소셜 로그인 후 추가 정보를 입력하여 회원가입을 완료합니다.
      operationId: user-register
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-v1-users-1422985128"
            examples:
              user-register:
                value: |-
                  {
                    "name" : "김철수",
                    "nickname" : "철수123",
                    "phoneNumber" : "010-1234-5678",
                    "email" : null,
                    "gender" : "MALE",
                    "age" : 25,
                    "birthDate" : null,
                    "provider" : "KAKAO",
                    "providerUserId" : "register-user"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-107230905"
              examples:
                user-register:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : 1,
                        "name" : "김철수",
                        "nickname" : "철수123",
                        "phoneNumber" : "010-1234-5678",
                        "email" : null,
                        "gender" : "MALE",
                        "age" : 25,
                        "birthDate" : null,
                        "joinedAt" : "2026-06-05 12:17:56",
                        "role" : null,
                        "createdAt" : "2026-06-05 12:17:56",
                        "updatedAt" : "2026-06-05 12:17:56"
                      },
                      "error" : null
                    }
  /api/v1/matches/1on1:
    get:
      tags:
      - Matching
      summary: 1:1 매칭 요청 목록 조회
      description: 퀴즈셋에 대한 내가 보낸/받은 1:1 매칭 요청 목록을 조회합니다.
      operationId: personal-match-list
      parameters:
      - name: quizSetId
        in: query
        description: 퀴즈 세트 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-matches-1on1-795708692"
              examples:
                personal-match-list:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "sent" : [ {
                          "id" : 1,
                          "quizSetId" : 10,
                          "requesterId" : 1,
                          "receiverId" : 2,
                          "status" : "PENDING",
                          "createdAt" : "2026-05-01 12:00:00",
                          "respondedAt" : null
                        } ],
                        "received" : [ {
                          "id" : 2,
                          "quizSetId" : 10,
                          "requesterId" : 3,
                          "receiverId" : 1,
                          "status" : "PENDING",
                          "createdAt" : "2026-05-01 12:00:00",
                          "respondedAt" : null
                        } ]
                      },
                      "error" : null
                    }
  /api/v1/matches/request:
    post:
      tags:
      - Matching
      summary: 1:1 매칭 요청
      description: 상대방에게 1:1 매칭을 요청합니다.
      operationId: personal-match-request
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-matches-request-793255208"
            examples:
              personal-match-request:
                value: |-
                  {
                    "receiverId" : 2,
                    "quizSetId" : 10
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-matches-request-1327932902"
              examples:
                personal-match-request:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : 1,
                        "quizSetId" : 10,
                        "requesterId" : 1,
                        "receiverId" : 2,
                        "status" : "PENDING",
                        "createdAt" : "2026-05-01 12:00:00",
                        "respondedAt" : null
                      },
                      "error" : null
                    }
  /api/v1/quiz-progress/answers:
    post:
      tags:
      - QuizProgress
      summary: 퀴즈 답안 제출
      description: 퀴즈에 대한 답안을 제출합니다. 이미 답변한 퀴즈에 재제출하면 선택지가 업데이트됩니다.
      operationId: quiz-progress-submit-answer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-quiz-progress-answers-1062387050"
            examples:
              quiz-progress-submit-answer:
                value: |-
                  {
                    "quizId" : 1,
                    "choiceId" : 2
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-auth-logout-1831456372"
              examples:
                quiz-progress-submit-answer:
                  value: |-
                    {
                      "success" : true,
                      "data" : null,
                      "error" : null
                    }
  /api/v1/quiz-progress/current:
    get:
      tags:
      - QuizProgress
      summary: 퀴즈 진행률 조회
      description: 현재 주차의 퀴즈 진행 상태를 조회합니다.
      operationId: quiz-progress-current
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-quiz-progress-current1012077415"
              examples:
                quiz-progress-current:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "status" : "COMPLETED",
                        "quizSetId" : 1,
                        "quizSetTitle" : "테스트 퀴즈셋",
                        "totalQuizzes" : 1,
                        "answeredQuizzes" : 1,
                        "participantCount" : 1
                      },
                      "error" : null
                    }
  /api/v1/quiz-progress/reset:
    post:
      tags:
      - QuizProgress
      summary: 퀴즈 진행 초기화
      description: 이번 주차의 퀴즈 답변과 진행 상태를 모두 초기화합니다.
      operationId: quiz-progress-reset
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-auth-logout-1831456372"
              examples:
                quiz-progress-reset:
                  value: |-
                    {
                      "success" : true,
                      "data" : null,
                      "error" : null
                    }
  /api/v1/quiz-sets/current-week:
    get:
      tags:
      - QuizSet
      summary: 이번 주차 퀴즈 세트 조회
      description: 현재 활성화된 이번 주차의 퀴즈 세트를 퀴즈 목록과 함께 조회합니다.
      operationId: quiz-set-current-week
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-quiz-sets-current-week-523790867"
              examples:
                quiz-set-current-week:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "year" : 2026,
                        "month" : 6,
                        "week" : 1,
                        "quizSets" : [ {
                          "id" : 1,
                          "year" : 2026,
                          "month" : 4,
                          "week" : 2,
                          "category" : "성격",
                          "title" : "이번 주 1:1 매칭",
                          "description" : "테스트 퀴즈 세트 설명",
                          "startDate" : "2026-06-04 12:17:56",
                          "endDate" : "2026-06-06 12:17:56",
                          "isActive" : true,
                          "matchingType" : "ONE_TO_ONE",
                          "quizzes" : [ {
                            "id" : 1,
                            "question" : "짜장면 vs 짬뽕?",
                            "quizSetId" : 1,
                            "choices" : [ {
                              "id" : 1,
                              "content" : "짜장면",
                              "order" : 1
                            }, {
                              "id" : 2,
                              "content" : "짬뽕",
                              "order" : 2
                            } ],
                            "order" : 1,
                            "createdAt" : "2026-06-05 12:17:56",
                            "updatedAt" : "2026-06-05 12:17:56"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/quiz-sets/{id}:
    get:
      tags:
      - QuizSet
      summary: 퀴즈 세트 단건 조회
      description: ID로 퀴즈 세트 메타데이터를 조회합니다.
      operationId: quiz-set-get
      parameters:
      - name: id
        in: path
        description: ""
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-quiz-sets-id1440540832"
              examples:
                quiz-set-get:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : 1,
                        "year" : 2026,
                        "month" : 4,
                        "week" : 2,
                        "category" : "성격",
                        "title" : "이번 주 1:1 매칭",
                        "description" : "테스트 퀴즈 세트 설명",
                        "startDate" : "2026-04-06 00:00:00",
                        "endDate" : "2026-04-12 23:59:59",
                        "isActive" : true,
                        "matchingType" : "ONE_TO_ONE",
                        "createdAt" : "2026-06-05 12:17:56",
                        "updatedAt" : "2026-06-05 12:17:56"
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/users/me:
    get:
      tags:
      - Users
      summary: 가입 정보 조회
      description: "소셜 로그인에서 받아온 가입 정보(이메일·생년월일)를 조회합니다. 온보딩 화면 prefill 용도이며, 가입 미\
        완료(PENDING) 회원도 접근할 수 있습니다."
      operationId: user-me
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-me506188890"
              examples:
                user-me:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "email" : "user@kakao.com",
                        "birthDate" : "1995-03-15"
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/matches/group/decline:
    post:
      tags:
      - Matching
      summary: 그룹 매칭 거절
      description: 그룹 매칭 참여를 거절합니다. 한 퀴즈셋당 한 번만 거절할 수 있습니다.
      operationId: group-match-decline
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-matches-group-decline-1969670024"
            examples:
              group-match-decline:
                value: |-
                  {
                    "quizSetId" : 10
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-matches-group-decline-789252668"
              examples:
                group-match-decline:
                  value: |-
                    {
                      "success" : true,
                      "data" : null,
                      "error" : null
                    }
  /api/v1/matches/group/join:
    post:
      tags:
      - Matching
      summary: 그룹 매칭 참여
      description: |-
        그룹 매칭에 참여합니다.

        - 참여 가능한 방이 있으면 기존 방에 배정됩니다.
        - 참여 가능한 방이 없으면 새 방을 생성합니다.
        - 참여자가 3명이 되면 방이 활성화(isActive=true)됩니다.
      operationId: group-match-join
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-matches-group-decline-1969670024"
            examples:
              group-match-join:
                value: |-
                  {
                    "quizSetId" : 10
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-matches-group-join-2080112672"
              examples:
                group-match-join:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "roomId" : 1,
                        "quizSetId" : 10,
                        "participantCount" : 1,
                        "isActive" : false
                      },
                      "error" : null
                    }
  /api/v1/matching/status/{quizSetId}:
    get:
      tags:
      - Matching
      summary: 매칭 상태 조회
      description: |-
        퀴즈셋에 대한 나의 매칭 현황을 조회합니다.

        - **personalMatch**: ACCEPTED > PENDING 우선 반환. 없으면 null
        - **groupMatchStatus**: DECLINED > JOINED > NONE 순으로 판단
      operationId: matching-status
      parameters:
      - name: quizSetId
        in: path
        description: 퀴즈 세트 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-matching-status-quizSetId-1585477117"
              examples:
                matching-status:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "quizSetId" : 10,
                        "personalMatch" : {
                          "id" : 1,
                          "requesterId" : 1,
                          "receiverId" : 2,
                          "status" : "ACCEPTED",
                          "createdAt" : "2026-05-01 12:00:00",
                          "respondedAt" : "2026-05-01 12:30:00"
                        },
                        "groupMatchStatus" : "JOINED",
                        "groupMatchRoomId" : 5
                      },
                      "error" : null
                    }
  /api/v1/quiz-progress/quiz-sets/{id}:
    get:
      tags:
      - QuizProgress
      summary: 퀴즈셋 + 답변 조회
      description: 퀴즈셋의 문제 목록과 사용자의 답변을 함께 조회합니다. 이어풀기에 사용됩니다.
      operationId: quiz-progress-quiz-set-with-progress
      parameters:
      - name: id
        in: path
        description: ""
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-quiz-progress-quiz-sets-id-1569645469"
              examples:
                quiz-progress-quiz-set-with-progress:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "quizzes" : [ {
                          "id" : 1,
                          "question" : "첫번째",
                          "quizSetId" : 1,
                          "choices" : [ {
                            "id" : 1,
                            "content" : "A",
                            "order" : 1
                          }, {
                            "id" : 2,
                            "content" : "B",
                            "order" : 2
                          } ],
                          "order" : 1,
                          "createdAt" : "2026-01-01 00:00:00",
                          "updatedAt" : "2026-01-01 00:00:00",
                          "userAnswer" : 1
                        }, {
                          "id" : 2,
                          "question" : "두번째",
                          "quizSetId" : 1,
                          "choices" : [ {
                            "id" : 3,
                            "content" : "C",
                            "order" : 1
                          }, {
                            "id" : 4,
                            "content" : "D",
                            "order" : 2
                          } ],
                          "order" : 2,
                          "createdAt" : "2026-01-01 00:00:00",
                          "updatedAt" : "2026-01-01 00:00:00",
                          "userAnswer" : null
                        } ],
                        "totalCount" : 2
                      },
                      "error" : null
                    }
  /api/v1/users/auth/logout:
    post:
      tags:
      - Auth
      summary: 로그아웃
      description: 액세스 토큰의 회원 정보로 모든 리프레시 토큰을 삭제하고 refreshToken 쿠키를 만료시킵니다.
      operationId: logout
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-auth-logout-1831456372"
              examples:
                logout:
                  value: |-
                    {
                      "success" : true,
                      "data" : null,
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/users/auth/refresh:
    post:
      tags:
      - Auth
      summary: 토큰 갱신
      description: refreshToken 쿠키로 새 액세스 토큰을 발급하고 refreshToken 쿠키를 재설정합니다.
      operationId: token-refresh
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-auth-refresh1774976609"
              examples:
                token-refresh:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "accessToken" : "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiIxIiwiaWF0IjoxNzgwNjI5NDczLCJleHAiOjE3ODA2MzMwNzN9.b2U7L1yO4RJ774e9RC_YBQTdaoX_LJHi1MxKQHG0XKGszrRRUVW-nJ9NFVDb3gb0el2anvvMRZjsgXLPWViZXQ"
                      },
                      "error" : null
                    }
  /api/v1/users/social-login/{provider}:
    get:
      tags:
      - OAuth
      summary: 소셜 로그인
      description: 소셜 로그인 제공자의 인가 페이지로 리다이렉트합니다.
      operationId: oauth-login
      parameters:
      - name: provider
        in: path
        description: 소셜 로그인 제공자 (KAKAO)
        required: true
        schema:
          type: string
      responses:
        "302":
          description: "302"
  /api/v1/users/{id}/leave:
    post:
      tags:
      - Users
      summary: 회원 탈퇴
      description: 회원을 탈퇴 처리합니다.
      operationId: user-leave
      parameters:
      - name: id
        in: path
        description: 사용자 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-id-leave-1444522536"
              examples:
                user-leave:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : 1,
                        "name" : null,
                        "nickname" : "탈퇴유저",
                        "phoneNumber" : null,
                        "email" : null,
                        "gender" : null,
                        "age" : null,
                        "birthDate" : null,
                        "joinedAt" : null,
                        "role" : null,
                        "createdAt" : "2026-06-05 12:17:56",
                        "updatedAt" : "2026-06-05 12:17:56"
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/matches/request/{id}/accept:
    post:
      tags:
      - Matching
      summary: 1:1 매칭 수락
      description: 받은 매칭 요청을 수락합니다. 수신자만 호출 가능합니다.
      operationId: personal-match-accept
      parameters:
      - name: id
        in: path
        description: 매칭 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-matches-request-id-accept-2011455419"
              examples:
                personal-match-accept:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : 1,
                        "quizSetId" : 10,
                        "requesterId" : 1,
                        "receiverId" : 2,
                        "status" : "ACCEPTED",
                        "createdAt" : "2026-05-01 12:00:00",
                        "respondedAt" : null
                      },
                      "error" : null
                    }
  /api/v1/matches/request/{id}/reject:
    post:
      tags:
      - Matching
      summary: 1:1 매칭 거절
      description: 받은 매칭 요청을 거절합니다. 수신자만 호출 가능합니다.
      operationId: personal-match-reject
      parameters:
      - name: id
        in: path
        description: 매칭 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
