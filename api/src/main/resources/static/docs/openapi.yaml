openapi: 3.0.1
info:
  title: Ditto API
  description: |-
    Ditto 서비스 API 문서입니다.

    ## 인증
    모든 API 요청에는 `X-API-Key` 헤더가 필요합니다.
    API Key는 백엔드 담당자에게 발급받으세요.

    ```
    X-API-Key: <발급받은 API Key>
    ```

    Swagger UI에서 테스트하려면 우측 상단의 **Authorize** 버튼을 클릭하고 API Key를 입력하세요.
  version: v1
servers:
- url: ""
tags: []
paths:
  /api/v1/member-reviews:
    get:
      tags:
      - Review
      summary: 내 미완료 평가 목록 조회
      description: "아직 완료하지 않은 평가를 평가 가능해진 순서(오래된 순)로 반환한다. 대상 목록에는 내가 확정한 답변만 실리며\
        , 상대가 나를 어떻게 평가했는지는 포함하지 않는다."
      operationId: member-reviews
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-member-reviews-883881201"
              examples:
                member-reviews:
                  value: |-
                    {
                      "success" : true,
                      "data" : [ {
                        "reviewId" : 1,
                        "matchType" : "GROUP",
                        "matchId" : 7,
                        "chatRoomId" : 100,
                        "availableAt" : "2026-08-02 23:59:59",
                        "status" : "IN_PROGRESS",
                        "answeredTargetCount" : 1,
                        "totalTargetCount" : 2,
                        "targets" : [ {
                          "memberId" : 2,
                          "nickname" : "댕이누나",
                          "gender" : "FEMALE",
                          "age" : 27,
                          "location" : "seoul",
                          "profileImageUrl" : "m1",
                          "meetingStatus" : "CHAT_ONLY",
                          "rating" : 4,
                          "comment" : "친절하고 재밌어요",
                          "answeredAt" : "2026-08-03 10:00:00"
                        }, {
                          "memberId" : 3,
                          "nickname" : "홍길동",
                          "gender" : "MALE",
                          "age" : 30,
                          "location" : "gyeonggi",
                          "profileImageUrl" : "m2",
                          "meetingStatus" : null,
                          "rating" : null,
                          "comment" : null,
                          "answeredAt" : null
                        } ]
                      } ],
                      "error" : null
                    }
  /api/v1/notifications:
    get:
      tags:
      - Notification
      summary: 알림 목록 조회
      description: 알림 센터의 목록을 최신순으로 조회합니다. 보관 기간(30일)이 지난 알림은 조회되지 않습니다. category
        를 생략하면 '전체' 탭입니다. 안읽음 여부는 readAt 이 null 인지로 판단하세요. nextCursor 가 null 이면 마지막
        페이지입니다.
      operationId: notifications-get
      parameters:
      - name: category
        in: query
        description: 필터 (MATCHING·CHAT·SYSTEM). 생략 시 전체
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: 이전 응답의 nextCursor. 생략 시 첫 페이지
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "페이지 크기 (기본 20, 최대 100)"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-notifications251687885"
              examples:
                notifications-get:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "notifications" : [ {
                          "id" : 2,
                          "type" : "CHAT_MESSAGE",
                          "category" : "CHAT",
                          "title" : "산책러버님의 새 메시지",
                          "body" : "나와 답변이 비슷한 사람들을 찾았어요. 지금 확인해 보세요.",
                          "targetId" : 22,
                          "readAt" : null,
                          "createdAt" : "2026-09-02 19:29:41"
                        }, {
                          "id" : 1,
                          "type" : "MATCH_RESULT",
                          "category" : "MATCHING",
                          "title" : "이번 주 매칭 결과가 나왔어요",
                          "body" : "나와 답변이 비슷한 사람들을 찾았어요. 지금 확인해 보세요.",
                          "targetId" : 11,
                          "readAt" : "2026-08-21 09:00:00",
                          "createdAt" : "2026-09-02 19:29:41"
                        } ],
                        "nextCursor" : null
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/user-reports:
    post:
      tags:
      - UserReports
      summary: 신고 접수
      description: 상대 회원을 신고합니다. 자기 신고·검토 대기 중인 동일 대상 재신고는 거부됩니다. 이미지는 업로드 URL 발급
        API로 업로드를 마친 objectKey를 전달합니다. block을 true로 보내면 신고와 함께 해당 회원을 차단합니다.
      operationId: user-report-create
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-v1-user-reports387435662"
            examples:
              user-report-create:
                value: |-
                  {
                    "reportedMemberId" : 2,
                    "reason" : "inappropriate-behavior",
                    "source" : "profile",
                    "detail" : "대화 중 폭언을 반복했습니다.",
                    "imageKeys" : [ "pending/user-reports/1/001dd050-e7d9-438e-8ac9-4930c452b69f" ],
                    "block" : false
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-user-reports900126493"
              examples:
                user-report-create:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : 1
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/users:
    post:
      tags:
      - Users
      summary: 회원가입
      description: 소셜 로그인 후 추가 정보를 입력하여 회원가입을 완료합니다.
      operationId: user-register
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-v1-users1263059898"
            examples:
              user-register:
                value: |-
                  {
                    "name" : "김철수",
                    "nickname" : "철수123",
                    "phoneNumber" : "010-1234-5678",
                    "email" : null,
                    "gender" : "MALE",
                    "age" : 25,
                    "birthDate" : null,
                    "interests" : [ "travel", "music" ],
                    "location" : "seoul",
                    "job" : "it-tech",
                    "caricature" : "/onboarding/profileimg/avatar/m1.svg",
                    "introduction" : "주말마다 한강 산책하는 걸 좋아해요!"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users479155738"
              examples:
                user-register:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : 1,
                        "name" : "김철수",
                        "nickname" : "철수123",
                        "phoneNumber" : "010-1234-5678",
                        "email" : null,
                        "gender" : "MALE",
                        "age" : 25,
                        "birthDate" : null,
                        "interests" : [ "music", "travel" ],
                        "location" : "seoul",
                        "job" : "it-tech",
                        "caricature" : "/onboarding/profileimg/avatar/m1.svg",
                        "joinedAt" : "2026-09-02 19:29:43",
                        "role" : null,
                        "createdAt" : "2026-09-02 19:29:43",
                        "updatedAt" : "2026-09-02 19:29:43"
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/chat/rooms:
    get:
      tags:
      - Chat
      summary: 내 채팅방 목록
      description: 내가 참여한 채팅방 목록을 최근 대화순으로 조회합니다.
      operationId: chat-rooms
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-chat-rooms-1047905630"
              examples:
                chat-rooms:
                  value: |-
                    {
                      "success" : true,
                      "data" : [ {
                        "roomId" : 1,
                        "sourceType" : "PERSONAL",
                        "counterpartMemberIds" : [ 2 ],
                        "lastMessage" : {
                          "id" : 3,
                          "roomId" : 1,
                          "senderId" : 2,
                          "messageType" : "TEXT",
                          "content" : "안녕하세요",
                          "imageUrl" : null,
                          "createdAt" : "2026-07-25 12:00:00"
                        },
                        "unreadCount" : 2,
                        "createdAt" : "2026-07-25 11:00:00",
                        "opensAt" : "2026-07-24 00:00:00",
                        "expiresAt" : "2026-07-27 00:00:00",
                        "isEnded" : false,
                        "endedAt" : null,
                        "endedReason" : null,
                        "hasLeft" : false
                      }, {
                        "roomId" : 2,
                        "sourceType" : "REMATCH",
                        "counterpartMemberIds" : [ 3 ],
                        "lastMessage" : {
                          "id" : 7,
                          "roomId" : 1,
                          "senderId" : 2,
                          "messageType" : "IMAGE",
                          "content" : "chat/2/photo.png",
                          "imageUrl" : "https://cdn.example.com/chat/3/photo.png",
                          "createdAt" : "2026-07-25 12:00:00"
                        },
                        "unreadCount" : 0,
                        "createdAt" : "2026-07-18 11:00:00",
                        "opensAt" : "2026-07-17 00:00:00",
                        "expiresAt" : "2026-07-20 00:00:00",
                        "isEnded" : true,
                        "endedAt" : "2026-07-19 21:30:00",
                        "endedReason" : "USER_ENDED",
                        "hasLeft" : false
                      } ],
                      "error" : null
                    }
  /api/v1/matches/1on1:
    get:
      tags:
      - Matching
      summary: 1:1 매칭 추천 후보 목록 조회
      description: "회원이 최근 완료한 1:1 퀴즈셋의 추천 후보를 매칭 점수 내림차순으로 조회합니다. 대상 퀴즈셋은 서버가 결정하\
        며, 응답의 quizSetId 로 확인합니다."
      operationId: match-candidate-list
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-matches-1on11956789472"
              examples:
                match-candidate-list:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "quizSetId" : 10,
                        "matchingType" : "ONE_TO_ONE",
                        "algorithmVersion" : "1.0",
                        "candidates" : [ {
                          "userId" : 2,
                          "nickname" : "디토",
                          "gender" : "FEMALE",
                          "age" : 27,
                          "introduction" : "한 단어로 표현하면 디토",
                          "location" : "seoul",
                          "profileImageUrl" : "f1",
                          "matchRate" : 87.5,
                          "scoreBreakdown" : {
                            "quizMatchRate" : 87.5,
                            "matchedQuestions" : 7,
                            "totalQuestions" : 8,
                            "reasons" : [ "전체 8문항 중 7문항이 일치했어요" ]
                          }
                        } ]
                      },
                      "error" : null
                    }
  /api/v1/matches/request:
    post:
      tags:
      - Matching
      summary: 1:1 매칭 요청
      description: 상대방에게 1:1 매칭을 요청합니다.
      operationId: personal-match-request
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-matches-request-793255208"
            examples:
              personal-match-request:
                value: |-
                  {
                    "receiverId" : 2,
                    "quizSetId" : 10
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-matches-request-1327932902"
              examples:
                personal-match-request:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : 1,
                        "quizSetId" : 10,
                        "requesterId" : 1,
                        "receiverId" : 2,
                        "status" : "PENDING",
                        "createdAt" : "2026-05-01 12:00:00",
                        "respondedAt" : null
                      },
                      "error" : null
                    }
  /api/v1/notifications/devices:
    post:
      tags:
      - Notification
      summary: 푸시 디바이스 토큰 등록
      description: "앱이 FCM 에서 받은 디바이스 토큰을 등록합니다. 로그인 직후·앱 실행·토큰 갱신 때마다 호출하세요. 재호출해\
        도 행이 늘지 않으며(멱등), 다른 회원의 토큰이었다면 소유자를 요청 회원으로 갱신합니다. registered 는 이번 호출로 이 회\
        원 소유가 됐는지입니다(신규·소유권 이전 true, 이미 내 토큰이던 재호출 false) — false 도 실패가 아닙니다. 실패는\
        \ success 가 말합니다."
      operationId: notification-devices-register
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-v1-notifications-devices-933306617"
            examples:
              notification-devices-register:
                value: |-
                  {
                    "token" : "dGVzdC1pbnN0YW5jZS1pZA:APA91bFxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
                    "platform" : "IOS"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-notifications-devices2085580702"
              examples:
                notification-devices-register:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "registered" : true
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/notifications/read-all:
    put:
      tags:
      - Notification
      summary: 알림 모두 읽음
      description: 안읽은 알림을 모두 읽음으로 표시합니다(화면 우상단 '모두 읽음'). 이미 다 읽었으면 readCount 가 0
        이며 성공합니다.
      operationId: notifications-read-all
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-notifications-read-all-418441164"
              examples:
                notifications-read-all:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "readCount" : 2
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/notifications/unread-count:
    get:
      tags:
      - Notification
      summary: 미읽음 알림 수 조회
      description: 홈 헤더 벨 배지용입니다. 목록과 같은 창(최근 30일)의 안읽은 알림만 셉니다.
      operationId: notifications-unread-count
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-notifications-unread-count1460512530"
              examples:
                notifications-unread-count:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "count" : 1
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/quiz-progress/answers:
    post:
      tags:
      - QuizProgress
      summary: 퀴즈 답안 제출
      description: 퀴즈에 대한 답안을 제출합니다. 이미 답변한 퀴즈에 재제출하면 선택지가 업데이트됩니다.
      operationId: quiz-progress-submit-answer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-quiz-progress-answers-1062387050"
            examples:
              quiz-progress-submit-answer:
                value: |-
                  {
                    "quizId" : 1,
                    "choiceId" : 2
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-auth-logout-1831456372"
              examples:
                quiz-progress-submit-answer:
                  value: |-
                    {
                      "success" : true,
                      "data" : null,
                      "error" : null
                    }
  /api/v1/quiz-progress/current:
    get:
      tags:
      - QuizProgress
      summary: 퀴즈 진행률 조회
      description: 현재 주차의 퀴즈 진행 상태를 조회합니다.
      operationId: quiz-progress-current
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-quiz-progress-current1012077415"
              examples:
                quiz-progress-current:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "status" : "COMPLETED",
                        "quizSetId" : 1,
                        "quizSetTitle" : "테스트 퀴즈셋",
                        "totalQuizzes" : 1,
                        "answeredQuizzes" : 1,
                        "participantCount" : 1
                      },
                      "error" : null
                    }
  /api/v1/quiz-progress/reset:
    post:
      tags:
      - QuizProgress
      summary: 퀴즈 진행 초기화
      description: 이번 주차의 퀴즈 답변과 진행 상태를 모두 초기화합니다.
      operationId: quiz-progress-reset
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-auth-logout-1831456372"
              examples:
                quiz-progress-reset:
                  value: |-
                    {
                      "success" : true,
                      "data" : null,
                      "error" : null
                    }
  /api/v1/quiz-sets/current-week:
    get:
      tags:
      - QuizSet
      summary: 이번 주차 퀴즈 세트 조회
      description: 현재 활성화된 이번 주차의 퀴즈 세트를 퀴즈 목록과 함께 조회합니다.
      operationId: quiz-set-current-week
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-quiz-sets-current-week838676343"
              examples:
                quiz-set-current-week:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "weekStartedOn" : "2026-08-31",
                        "year" : 2026,
                        "month" : 8,
                        "week" : 6,
                        "quizSets" : [ {
                          "id" : 1,
                          "weekStartedOn" : "2026-08-31",
                          "year" : 2026,
                          "month" : 8,
                          "week" : 6,
                          "category" : "성격",
                          "title" : "이번 주 1:1 매칭",
                          "description" : "테스트 퀴즈 세트 설명",
                          "startDate" : "2026-09-01 19:29:42",
                          "endDate" : "2026-09-03 19:29:42",
                          "isActive" : true,
                          "matchingType" : "ONE_TO_ONE",
                          "quizzes" : [ {
                            "id" : 1,
                            "question" : "짜장면 vs 짬뽕?",
                            "quizSetId" : 1,
                            "choices" : [ {
                              "id" : 1,
                              "content" : "짜장면",
                              "order" : 1
                            }, {
                              "id" : 2,
                              "content" : "짬뽕",
                              "order" : 2
                            } ],
                            "order" : 1,
                            "createdAt" : "2026-09-02 19:29:42",
                            "updatedAt" : "2026-09-02 19:29:42"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/quiz-sets/{id}:
    get:
      tags:
      - QuizSet
      summary: 퀴즈 세트 단건 조회
      description: ID로 퀴즈 세트 메타데이터를 조회합니다.
      operationId: quiz-set-get
      parameters:
      - name: id
        in: path
        description: ""
