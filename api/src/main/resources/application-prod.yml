management:
  server:
    port: 8080
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /docs
    url: /docs/openapi.yaml

ditto:
  quiz:
    available-days:
      - MONDAY
      - TUESDAY
      - WEDNESDAY
  security:
    api-key: ${API_KEY}
  cors:
    # 쉼표 구분 환경변수 — 값은 .aws/task-definition.json 이 SSOT (배포마다 그 파일이 그대로 등록된다)
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
