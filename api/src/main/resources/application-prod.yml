management:
  server:
    port: 8080
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Grafana에서 p95를 보려는 버킷. percentiles-histogram(버킷 70여 개)을 켜면 엔드포인트×상태 조합마다
      # 곱해져 Grafana Cloud 무료 한도(10K series)를 넘으므로, 판단에 필요한 경계만 고정한다.
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s

springdoc:
  swagger-ui:
    path: /docs
    url: /docs/openapi.yaml

ditto:
  quiz:
    available-days:
      - MONDAY
      - TUESDAY
      - WEDNESDAY
  security:
    api-key: ${API_KEY}
  cors:
    # 쉼표 구분 환경변수 — 값은 .aws/task-definition.json 이 SSOT (배포마다 그 파일이 그대로 등록된다)
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  chat:
    content-encryption-key: ${CHAT_CONTENT_ENCRYPTION_KEY}
