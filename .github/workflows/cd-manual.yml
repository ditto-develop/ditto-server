name: CD (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '배포할 브랜치'
        required: true
        default: 'main'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ditto-api
  ECR_ALLOY_REPOSITORY: ditto-alloy
  ECS_CLUSTER: ditto-cluster
  ECS_SERVICE: ditto-api-service

jobs:
  deploy:
    name: Build & Deploy to ECS
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # workflow_dispatch 의 github.sha 는 기본 브랜치(main) HEAD 다. 다른 브랜치를 배포하면
      # 그 브랜치 이미지가 main 커밋 태그를 덮어쓰게 되므로, 실제로 체크아웃한 커밋으로 태그한다.
      - name: Resolve image tag
        id: tag
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.sha }}
        run: |
          docker buildx build --platform linux/arm64 --push \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

      - name: Build and push Alloy image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.sha }}
        run: |
          docker buildx build --platform linux/arm64 --push \
            -t $ECR_REGISTRY/$ECR_ALLOY_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_ALLOY_REPOSITORY:latest .aws/alloy

      # 태스크 정의에 `latest` 가 아니라 이번 커밋 이미지를 박는다. `latest` 로 두면 배포가 실패해
      # 이전 정의로 되돌아가도 그 정의 역시 `latest`(=실패한 이미지)를 가리켜, 태스크가 다시 뜨는
      # 순간 고장 난 이미지를 받는다(#336, ADR 0050).
      - name: Pin API image in task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definition.json
          container-name: ditto-api
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.sha }}

      - name: Pin Alloy image in task definition
        id: render-alloy
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          container-name: alloy
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_ALLOY_REPOSITORY }}:${{ steps.tag.outputs.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-alloy.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          force-new-deployment: true
